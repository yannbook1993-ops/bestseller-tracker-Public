     ════════════════════════════════════════════════════════════════════ -->
<script id="srvfix1001">
(function(){
  const K=(typeof CFG_K!=='undefined')?CFG_K:'tower.cfg', VER='20261001';
  try{
    const c=JSON.parse(localStorage.getItem(K)||'{}')||{};
    if(c.srvfix!==VER){ c.useServer=true; c.srvfix=VER; localStorage.setItem(K,JSON.stringify(c)); }
  }catch(e){}

  // 서버 응답을 1분간 기억한다 — 다시 얹을 때마다 1만 행을 또 받지 않도록
  if(typeof sbGet==='function'){
    const _g=sbGet; let memo={}, at=0;
    window.sbGet=sbGet=function(path){
      if(Date.now()-at>60000){ memo={}; at=Date.now(); }
      if(!memo[path])memo[path]=_g(path).catch(e=>{ delete memo[path]; throw e; });
      return memo[path];
    };
  }

  let loaded=false, busy=false;
  if(typeof serverSync==='function'){
    const _ss=serverSync;
    window.serverSync=serverSync=async function(){
      const n=await _ss.apply(this,arguments);
      if(n>0)loaded=true;
      return n;
    };
  }
  if(typeof rebuildAll==='function'){
    const _ra=rebuildAll;
    window.rebuildAll=rebuildAll=function(){
      const ctx=_ra.apply(this,arguments);
      // 서버 자료를 한 번이라도 받았다면, 파일 자료로 되돌아간 회차 위에 서버 자료를 다시 얹는다
      if(loaded&&!busy){
        let on=false; try{ on=!!getCfg().useServer; }catch(e){}
        if(on){ busy=true; Promise.resolve(serverSync(true)).finally(()=>{ busy=false; }); }
      }
      return ctx;
    };
  }
})();
</script>

<script id="arch1001">
/* 지난 회차 분야 순위 — 서버에서 옮긴 자료는 드라이브 보관 파일에서 불러온다.
   보관 파일: 서점·하루 단위 (g_<서점>_<YYYYMMDD>.json). 한 번 받으면 이 브라우저에 오래 둔다. */
(function(){
  const GS='https://script.google.com/macros/s/AKfycbx2pdllsyEobOORO9Y7QeMZwCIaMvdNzoQmBoE3gTf_GQfPK88mtS6wKsv3lGziLOhV/exec';
  const H=()=>({apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`});
  let IDX=null, IDXat=0;
  async function archIdx(){
    if(IDX&&Date.now()-IDXat<36e5)return IDX;
    const set=new Set();
    try{
      for(let off=0;;off+=1000){
        const r=await fetch(`${SB_URL}/rest/v1/arch_idx?select=shop,wk&order=wk&limit=1000&offset=${off}`,{headers:H()});
        if(!r.ok)break;
        const a=await r.json();
        a.forEach(x=>set.add(x.shop+':'+x.wk));
        if(a.length<1000)break;
      }
    }catch(e){}
    IDX=set; IDXat=Date.now(); return set;
  }
  async function archDay(shop,wk){
    const ck=`ad:${shop}:${wk}`;
    const hit=await idbGet(ck).catch(()=>null);
    if(hit&&hit.d)return hit.d;                      // 지난 날짜 자료는 바뀌지 않는다
    let last=null;
    for(let i=0;i<3;i++){                             // 구글 쪽이 가끔 한 번 실패한다
      try{
        const r=await fetch(`${GS}?action=arch_get&name=g_${shop}_${wk}.json`);
        if(r.ok){
          const j=await r.json();
          if(j&&j.rows){ await idbSet(ck,{d:j,at:Date.now()}).catch(()=>{}); return j; }
          last=new Error(j&&j.error||'보관 파일 없음');
        }else last=new Error('드라이브 응답 '+r.status);
      }catch(e){ last=e; }
      await new Promise(f=>setTimeout(f,1200*(i+1)));
    }
    throw last||new Error('보관 파일을 받지 못했습니다');
  }
  const _orig=loadGRank;
  loadGRank=async function(shop,code,wk,limit){
    let archived=false;
    try{ archived=(await archIdx()).has(shop+':'+wk); }catch(e){}
    if(!archived)return _orig(shop,code,wk,limit);
    // 서버에 아직 전체가 남아 있으면 서버가 빠르다. 2위가 있으면 남아 있는 것.
    try{
      const q=`${SB_URL}/rest/v1/granks?select=rank&shop=eq.${shop}&code=eq.${encodeURIComponent(code)}&wk=eq.${wk}&rank=eq.2&limit=1`;
      const r=await fetch(q,{headers:H()});
      if(r.ok&&(await r.json()).length)return _orig(shop,code,wk,limit);
    }catch(e){}
    const ck=`gr:${shop}:${code}:${wk}:${limit}`;
    const hit=await idbGet(ck).catch(()=>null);
    if(hit&&hit.arch)return hit.d;
    const day=await archDay(shop,wk);
    const cs=String(code);
    const rows=day.rows.filter(x=>String(x[0])===cs).sort((a,b)=>a[1]-b[1]).slice(0,limit);
    const d=rows.map(x=>{
      const b=day.books&&day.books[x[2]];
      return {rank:x[1],isbn:x[2],sp:x[3],
        gbooks:b?{title:b[0],author:b[1],pub:b[2],pubdate:b[3],price:b[4]}:null};
    });
    await idbSet(ck,{d,at:Date.now(),arch:1}).catch(()=>{});
    return d;
  };
})();
</script>

<!-- ═══ 표지 보정 · 2026-10-02 ════════════════════════════════════════════
     서버 자료 우선 블록 뒤, </body> 바로 앞에 붙인다. 원래 코드는 건드리지 않고 tryCoverChain 만 갈아 끼운다.
     증상: 도서 상세에 표지가 안 뜨고 「표지 연결하기」만 나온다.
     원인
       1) 알라딘 표지 주소를 상품ID 로 만들던 형식(cover/cover500/{ID}_1.jpg 등)이 전부 404 다.
          알라딘 실제 주소는 product/{앞5}/{다음2}/cover500/{ISBN10}_{버전}.jpg 라 ID 만으로 못 만든다.
       2) 서버(book-cover 함수)가 확인해 covers 표에 적어 둔 표지 주소를 화면이 읽지 않았다.
       3) 9/8 이후 회차는 상품ID(pid)마저 비어 교보·예스24 후보도 안 생겼다(서버는 10/2 에 고침).
     고친 것 — 표지 후보 순서
       ① 서버 cover_pick 의 주소 — 도서관 정보나루 표지를 모으는 동안은 기존 covers 우선,
          다 모이면 서버(cover_cfg.mode=lib)가 정보나루 우선으로 바꾼다
          (10/2 추가) 카카오 책 검색 표지도 함께 모은다 — 정보나루에 없으면 카카오
       ② 서버에 아직 없으면 카카오(book-info) → book-cover 함수 순으로 바로 묻는다
       ③ 그래도 없으면 예전 후보(깨진 알라딘 형식은 뺀다)
     ════════════════════════════════════════════════════════════════════ -->
<script id="coverfix1002">
(function(){
  if(typeof tryCoverChain!=='function'||typeof SB_URL==='undefined')return;
  const H={apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`};
  const FN=`${SB_URL}/functions/v1/book-cover`;
  let MAP=null, mapAt=0, mapP=null;           // isbn → {url} 또는 {none:true}
  const asked={};                               // 이 세션에서 함수에 물어본 책

  /** covers 표를 통째로 받아 둔다. 확인된 주소와 「없음 확인」만 담는다. 30분 기억. */
  function coverMap(){
    if(MAP&&Date.now()-mapAt<18e5)return Promise.resolve(MAP);
    if(mapP)return mapP;
    mapP=(async()=>{
      const m={};
      try{
        for(let off=0;;off+=1000){
          // cover_pick — 서버가 고른 표지 한 줄. 정보나루 수집이 끝나기 전엔 기존 covers 우선,
          // 다 모이면 서버가 정보나루 우선으로 바꾼다. 화면은 고른 결과만 읽는다.
          const r=await fetch(`${SB_URL}/rest/v1/cover_pick?select=isbn,url,none&or=(url.not.is.null,none.is.true)&order=isbn&limit=1000&offset=${off}`,{headers:H});
          if(!r.ok)break;
          const a=await r.json();
          a.forEach(x=>{ m[x.isbn]=x.url?{url:x.url}:{none:true}; });
          if(a.length<1000)break;
        }
      }catch(e){}
      MAP=m; mapAt=Date.now(); mapP=null; return m;
    })();
    return mapP;
  }
  coverMap();   // 미리 받아 둔다

  /** 서버에 없는 책 — ① 카카오(book-info, 서버에 둔 키) ② book-cover 함수(찾으면 covers 에 적힌다). */
  async function askServer(isbn){
    if(asked[isbn])return asked[isbn];
    asked[isbn]=(async()=>{
      try{
        const r=await fetch(`${SB_URL}/functions/v1/book-info`,{method:'POST',
          headers:{'Content-Type':'application/json'},body:JSON.stringify({isbn})});
        const j=await r.json();
        if(j&&j.cover){ const u=String(j.cover).replace(/^http:/,'https:');
          if(MAP)MAP[isbn]={url:u}; return u; }
      }catch(e){}
      try{
        const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({isbns:[isbn]})});
        const j=await r.json();
        const x=j&&j.results&&j.results[0];
        if(x&&x.url){ if(MAP)MAP[isbn]={url:x.url}; return x.url; }
        if(x&&x.src==='none'&&MAP)MAP[isbn]={none:true};
      }catch(e){}
      return null;
    })();
    return asked[isbn];
  }

  // 알라딘 상품ID 로 만든 주소는 404 라 뺀다. product/ 경로(실제 주소)는 남긴다.
  const broken=u=>/image\.aladin\.co\.kr\/(cover\/cover\d+|coversum)\//.test(u);

  const _old=tryCoverChain;
  window.tryCoverChain=tryCoverChain=function(isbn, box, onFail){
    (async()=>{
      let urls=[];
      try{
        const m=await coverMap();
        const hit=m[isbn];
        if(hit&&hit.url)urls.push(hit.url);
        else if(!hit){ const u=await askServer(isbn); if(u)urls.push(u); }
      }catch(e){}
      if(CUR!==isbn)return;
      let rest=[];
      try{ rest=COVER_URLS(isbn).filter(u=>!broken(u)); }catch(e){}
      rest.forEach(u=>{ if(!urls.includes(u))urls.push(u); });
      if(!urls.length){ onFail(); return; }

      let k=0;
      const img=new Image();
      img.referrerPolicy='no-referrer';
      img.onload=()=>{
        if(CUR!==isbn)return;
        if(img.naturalWidth<40||img.naturalHeight<40){ next(); return; }
        box.innerHTML=`<img src="${esc(img.src)}" alt="표지" referrerpolicy="no-referrer">`;
        box.hidden=false;
        bindZoom(box);
        idbSet('cover:'+isbn,{url:img.src,at:Date.now()}).catch(()=>{});
      };
      img.onerror=next;
      function next(){ k++; if(k<urls.length){ img.src=urls[k]; } else onFail(); }
      img.src=urls[0];
    })();
  };
})();
</script>

<!-- ═══ 화면 다듬기 · 2026-10-02 ════════════════════════════════════════
     표지 보정 블록 뒤, </body> 바로 앞에 붙인다. 원래 규칙은 지우지 않고 뒤에서 덮어쓴다.
     모션
       1) 기간·날짜·서점을 바꿀 때마다 목록 50줄과 카드가 투명에서 다시 솟아 화면 전체가 깜빡였다
          → 처음 한 번만 차례로 올라오고, 그 뒤 다시 그릴 때는 짧고 옅은 페이드만 준다
       2) 카드의 튕기는 팝(오버슈트)이 나머지 모션과 결이 달랐다 → 같은 페이드업으로
       3) PC 상세 패널이 반투명으로 겹쳐 보이고, 본문 폭이 0.28초 동안 줄며 글자가 프레임마다 다시 감겼다
          → 패널은 오른쪽 끝에서 불투명하게 밀려 나오고, 본문 폭은 한 번에 바뀐다
       4) 인트로 대기 2.25초 → 1.3초 (세션당 한 번은 그대로)
     레이아웃
       5) PC 카드가 탭·목록보다 8px 안쪽에 있었다 → 같은 가장자리에
       6) 「신규 진입/이탈」 전환 상자가 안여백 때문에 다른 줄보다 넓었다
       7) 상세를 열면 카드가 좁아지며 「3사 동시 등/재」처럼 글자가 깨졌다 → 한 줄 유지, 넘치면 가로로 민다
       8) 사이드바에서 고른 항목만 테두리가 생겨 1px 밀렸다
       9) 이벤트 필터 칩이 오른쪽에서 뚝 잘렸다 → 끝을 흐리게
      10) 상세 표지가 머리줄에 붙어 있었다
      11) 키보드로 움직일 때 어디에 있는지 보이지 않았다
     ════════════════════════════════════════════════════════════════════ -->
<style id="uifix1002">

<script id="uifix1002js">
(function(){
  const root=document.documentElement;
  // 첫 화면이 다 그려진 뒤부터는 다시 그려도 깜빡이지 않게 한다
  const settle=()=>setTimeout(()=>root.classList.add('ui-settled'),900);
  if(document.readyState==='complete')settle(); else addEventListener('load',settle);

  // 탭을 옮길 때만 새 화면을 한 번 차례로 올린다
  const nav=document.getElementById('nav');
  if(nav)nav.addEventListener('click',()=>{
    ['list','newbody','report'].forEach(id=>{
      const el=document.getElementById(id); if(!el)return;
      el.classList.add('ui-enter');
      setTimeout(()=>el.classList.remove('ui-enter'),700);
    });
  },true);

  // 칩 줄이 끝까지 밀리면 흐림을 걷는다
  const edge=el=>{ if(!el)return;
    const f=()=>el.classList.toggle('ui-end',el.scrollLeft+el.clientWidth>=el.scrollWidth-2);
    el.addEventListener('scroll',f,{passive:true});
    // 숨은 탭에서는 폭이 0 이라 잘못 잰다. 보일 때(크기가 바뀔 때) 다시 잰다.
    if(window.ResizeObserver)new ResizeObserver(f).observe(el); else addEventListener('resize',f); };
  edge(document.getElementById('evseg')); edge(document.getElementById('evkind'));
})();
</script>

<!-- ═══ 도서 상세 보정 · 2026-10-02 ═══════════════════════════════════════
     증상: 순위에서 책을 눌러도 상세가 안 열리는 책이 많다(클릭해도 반응 없음).
     원인: 서버 자료를 받은 뒤 도서 이력(DB.hist)을 3사 일간·주간으로만 다시 만든다(mfix 의 rebuildHist).
           연간 순위(2000~2025)에만 있는 책 2,516종, 교보 단독 소급 일간(2024~)에만 있는 책 2,682종은
           이력이 없어 openBook 이 조용히 돌아갔다. 검색에도 안 잡혔다.
     고친 것: 서버 자료를 받은 뒤 모든 기간의 회차를 훑어 이력이 없는 책을 채운다.
           연간 순위는 「다른 기간 기록」에 해마다, 교보 단독 일간은 한 줄 요약(기간·최고 순위·횟수)으로 넣는다.
           3사 통합 순위 추이에는 섞지 않는다 — 집계 방식이 달라 비교하면 안 된다.
           그래도 없으면 누른 순간 그 행의 서지로 상세를 연다.
     ════════════════════════════════════════════════════════════════════ -->
<script id="bookfix1002">
(function(){
  if(typeof openBook!=='function'||typeof DB==='undefined')return;
  const META=['t','au','p','g','pd','pr'];
  const meta=(b,x)=>META.forEach(k=>{ if(!b[k]&&x[k])b[k]=x[k]; });
  const sets=()=>{ try{ return SETS; }catch(e){ return DB; } };

  function ensureHist(){
    const H=DB.hist||(DB.hist={}); const S=sets();
    // 연간 — 「다른 기간 기록」에 해마다
    (S.annual||[]).forEach(rd=>(rd.rows||[]).forEach(x=>{
      if(!x.i)return;
      const b=H[x.i]||(H[x.i]={t:x.t,h:[]}); meta(b,x);
      const y=String(rd.y||'').slice(0,4); if(!y)return;
      b.an=b.an||[]; if(!b.an.some(a=>a.y===y))b.an.push({y,r:x.r});
    }));
    // 교보 단독 일간(과거 소급) — 한 줄 요약
    const ko={};
    (S.daily||[]).filter(rd=>rd.src).forEach(rd=>{
      const d=`${rd.y}.${rd.m}.${rd.d}`;
      (rd.rows||[]).forEach(x=>{ if(!x.i)return;
        const k=ko[x.i]||(ko[x.i]={n:0,best:999,from:d,to:d,src:rd.src,x});
        k.n++; if(x.r<k.best)k.best=x.r; if(d<k.from)k.from=d; if(d>k.to)k.to=d; });
    });
    Object.entries(ko).forEach(([i,k])=>{
      const b=H[i]||(H[i]={t:k.x.t,h:[]}); meta(b,k.x);
      const l=`${k.src} 단독 일간 · ${k.from}~${k.to} · ${k.n}회`;
      b.wk=(b.wk||[]).filter(w=>!/단독 일간/.test(w.l)); b.wk.push({l:`${l} 중 최고`,r:k.best});
    });
    // 월간 등 나머지 — 서지만이라도
    ['monthly','weekly','half'].forEach(per=>(S[per]||[]).forEach(rd=>(rd.rows||[]).forEach(x=>{
      if(!x.i)return; const b=H[x.i]||(H[x.i]={t:x.t,h:[]}); meta(b,x); })));
    Object.values(H).forEach(b=>{ if(!b.h)b.h=[]; });
  }
  window.ensureHist=ensureHist;

  const after=()=>{ try{ ensureHist(); if(typeof rebuildSearch==='function')rebuildSearch(); }
                    catch(e){ console.warn('[bookfix] 이력 채우기 실패',e); } };
  if(typeof serverSync==='function'){
    const _ss=serverSync;
    window.serverSync=serverSync=async function(){
      const n=await _ss.apply(this,arguments);
      if(n>0)after();
      return n;
    };
  }
  if(typeof rebuildAll==='function'){
    const _ra=rebuildAll;
    window.rebuildAll=rebuildAll=function(){ const r=_ra.apply(this,arguments); after(); return r; };
  }

  // 누른 순간에도 없으면 그 행의 서지로 연다
  const _ob=openBook;
  window.openBook=openBook=function(isbn){
    if(isbn&&!DB.hist[isbn]){
      ensureHist();
      if(!DB.hist[isbn]){
        const S=sets(); let row=null;
        for(const per of Object.keys(S)){ const arr=S[per]; if(!Array.isArray(arr))continue;
          for(const rd of arr){ row=(rd.rows||[]).find(x=>x.i===isbn); if(row)break; } if(row)break; }
        DB.hist[isbn]=Object.assign({h:[]},row?{t:row.t,au:row.au,p:row.p,g:row.g,pd:row.pd,pr:row.pr}:{t:isbn});
      }
    }
    return _ob.apply(this,arguments);
  };
  after();
})();
</script>
