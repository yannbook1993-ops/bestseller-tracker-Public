/** 분야별 서술 — PDF의 【소설】【에세이】 절 형식을 실데이터로 생성한다 */
function genreParagraphs(rows,N,ref,unrel){
  const byG={};
  rows.forEach(x=>{(byG[x.g]=byG[x.g]||[]).push(x);});
  const order=Object.entries(byG).sort((a,b)=>b[1].length-a[1].length).slice(0,6);
  if(!order.length)return '';
  const GC=['#22e08a','#3d87f5','#f2a07b','#c88df0','#63d9d2','#f5c85c'];
  const top=order[0][1].length;

  // 분야 비중을 한눈에 — 긴 문장보다 막대가 빠르다
  const bars=`<div class="gbars">
    ${order.map(([g,arr],i)=>{
      const pct=Math.round(arr.length/N*100);
      return `<div class="gbar">
        <span class="gl">${esc(g||'미분류')}</span>
        <span class="gt"><i style="width:${Math.round(arr.length/top*100)}%;
          background:${GC[i%GC.length]}"></i></span>
        <span class="gn">${arr.length}종<em>${pct}%</em></span></div>`;
    }).join('')}
  </div>`;

  const cards=order.map(([g,arr],i)=>{
    arr=arr.slice().sort((a,b)=>a.r-b.r);
    const cnt=arr.length, pct=Math.round(cnt/N*100);
    const newN=arr.filter(x=>x._new).length;
    const oldN=unrel?0:arr.filter(x=>isOld(age(pubDate(x),ref))).length;
    const pc={}; arr.forEach(x=>{if(x.p)pc[x.p]=(pc[x.p]||0)+1;});
    const topPub=Object.entries(pc).sort((a,b)=>b[1]-a[1])[0];
    const t4=arr.slice(0,4);
    const inTop4=topPub?t4.filter(x=>x.p===topPub[0]).length:0;
    let head, why;
    if(inTop4>=2){ head=`${topPub[0]} 라인업이 이끈 ${g}`; why=`한 출판사 책 ${topPub[1]}종`; }
    else if(newN/cnt>=0.4){ head=`신간이 밀어붙인 ${g}`; why=`신규 진입 ${newN}종`; }
    else if(oldN/cnt>=0.3){ head=`스테디셀러가 지킨 ${g}`; why=`구간 ${oldN}종`; }
    else { head=`${g} 강세`; why=null; }

    return `<div class="gcard">
      <div class="gh">
        <span class="gdot" style="background:${GC[i%GC.length]}"></span>
        <b>${esc(g||'미분류')}</b>
        <span class="gcnt">${cnt}종 · ${pct}%</span>
      </div>
      <p class="ghead">${esc(head)}${why?` <em>${esc(why)}</em>`:''}</p>
      <table class="gtb"><tbody>
        ${t4.map(x=>{
          const n=unrel?null:age(x.pd,ref);
          const tag=x._new?['신규','nw']:x.dl>0?[`▲${x.dl}`,'up']
            :x.dl<0?[`▼${-x.dl}`,'dn']:isOld(n)?['구간','ol']:['','' ];
          return `<tr data-i="${esc(x.i)}">
            <td class="gr2">${x.r}</td>
            <td class="gt2">${nm(x)}<span>${esc(x.p||'출판사 미상')}</span></td>
            <td class="gg2">${tag[0]?`<i class="${tag[1]}">${tag[0]}</i>`:''}</td>
          </tr>`;
        }).join('')}
      </tbody></table>
    </div>`;
  }).join('');

  return bars+`<div class="gcards">${cards}</div>`;
}

/** 도서 상세 전용 순위 그래프 — 점마다 순위와 일자를 직접 얹는다.
    표를 없앤 대신 그래프 하나로 다 읽히게 한다. */
function rankChart(pts){
  const W=680,H=210,L=30,R=30,T=34,B=34;
  if(pts.length<2)return `<p class="none">자료가 2회차 미만이라 추이를 그리지 않습니다.</p>`;
  const vs=pts.map(p=>p.v);
  const mn=Math.min(...vs),mx=Math.max(...vs),flat=mx===mn,rg=(mx-mn)||1;
  const X=n=>L+(W-L-R)*(pts.length<2?0:n/(pts.length-1));
  const Y=v=>flat?T+(H-T-B)/2:T+(H-T-B)*((v-mn)/rg);   // 위쪽이 상위
  const line=pts.map((p,n)=>`${n?'L':'M'}${X(n).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const area=`${line} L${X(pts.length-1).toFixed(1)},${H-B} L${X(0).toFixed(1)},${H-B} Z`;
  const rise=pts[pts.length-1].v<=pts[0].v;            // 순위는 작을수록 좋다
  const col=rise?'#f5455c':'#3d87f5';
  // 점이 많으면 라벨이 겹친다. 최대 8개만 글자를 붙인다.
  const step=Math.max(1,Math.ceil(pts.length/8));
  let g='';
  pts.forEach((p,n)=>{
    const x=X(n),y=Y(p.v);
    g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4" fill="${col}"
        stroke="#141418" stroke-width="1.6"/>`;
    const show = n===0 || n===pts.length-1 || n%step===0;
    if(!show)return;
    const anchor = n===0?'start':n===pts.length-1?'end':'middle';
    const dx = n===0?-4:n===pts.length-1?4:0;
    g+=`<text x="${(x+dx).toFixed(1)}" y="${(y-11).toFixed(1)}" font-size="12" font-weight="700"
        fill="#f0f0f3" text-anchor="${anchor}">${p.v}위</text>`;
    g+=`<text x="${(x+dx).toFixed(1)}" y="${H-12}" font-size="10" fill="#63636d"
        text-anchor="${anchor}">${esc(p.l)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
    <defs><linearGradient id="rg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".24"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#rg1)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${g}</svg>`;
}

function chart(pts,inv){
  const W=680,H=170,L=6,R=46,T=16,B=20;
  const vs=pts.map(p=>p.v);
  if(vs.length<2)return `<p class="none">자료가 2회차 미만이라 추이를 그리지 않습니다.</p>`;
  const mn=Math.min(...vs),mx=Math.max(...vs),flat=mx===mn,rg=(mx-mn)||1;
  const X=n=>L+(W-L-R)*(pts.length<2?0:n/(pts.length-1));
  // 값이 내내 같으면 선을 위아래 가운데에 둔다 (맨 위에 붙어 보이지 않게)
  const Y=v=>flat?T+(H-T-B)/2
    :inv?T+(H-T-B)*((v-mn)/rg):T+(H-T-B)*(1-(v-mn)/rg);
  const line=pts.map((p,n)=>`${n?'L':'M'}${X(n).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const area=`${line} L${X(pts.length-1).toFixed(1)},${H-B} L${X(0).toFixed(1)},${H-B} Z`;
  const rise=pts[pts.length-1].v>=pts[0].v, col=inv?(rise?'#3d87f5':'#f5455c'):(rise?'#f5455c':'#3d87f5');
  const dots=pts.map((p,n)=>`<circle cx="${X(n).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6" fill="${col}"/>`).join('');
  const lab=(flat?[mx]:[mx,mn]).map(v=>
    `<text x="${W-R+6}" y="${(Y(v)+4).toFixed(1)}" font-size="10.5" fill="#63636d">${inv?v+'위':fmt(v)}</text>`).join('');
  const xt=[0,pts.length-1].map(n=>`<text x="${X(n).toFixed(1)}" y="${H-4}" font-size="10" fill="#63636d"
    text-anchor="${n?'end':'start'}">${esc(pts[n].l)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".26"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#g1)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    ${dots}${lab}${xt}</svg>`;
}

/* ── 마케팅 분석 카드 (조사분) ─────────────────────────────

/* ── 마케팅 분석 카드 (조사분) ─────────────────────────────
   시각 배지 몇 개로 압축한다. 근거·출처는 펼쳐야 보인다. */
const TAGICON={
  influencer:['👤','인플루언서'], press:['📰','언론'], event:['🎟️','이벤트'],
  bundle:['📦','굿즈·번들'], storepromo:['🏬','서점기획'], offline:['🏢','오프라인'],
  backlist:['📚','전작 팬덤'], author:['✒️','유명 저자'],
  ad:['📢','광고'], none:['🚫','미확인'],
  classics:['📖','고전 재유행'], trend:['🎬','영상화 IP'], institutional:['🏫','제도적 수요'],
  award:['🏆','수상 이력'],
};
/* ── 국립중앙도서관 ISBN 서지정보 ─────────────────────────
   출판사가 한국서지표준센터에 통보한 원본 서지. 서점 파일에 없는
   키워드·쪽수·판형·언어를 채운다. 조회 결과는 기기에 캐시해 재조회하지 않는다. */
/* ── Meta 광고 (Marketing API) ─────────────────────────────
   내 광고 계정의 캠페인 성과만 볼 수 있다. 다른 출판사 집행 내역은 못 본다
   (그건 Ad Library API 영역이고 지출·노출이 구간으로만 나온다).
   여기서는 「내가 켠 광고와 순위가 같이 움직였는가」를 보는 데 쓴다. */
const META_API='https://graph.facebook.com/v25.0';
function metaCfg(){
  const c=getCfg();
  const act=String(c.metaAct||'').replace(/^act_/,'').trim();
  return {act, tok:(c.metaTok||'').trim()};
}
/** 캠페인별 일자 성과. 28일 소급 정정이 있어 캐시는 하루만 쓴다. */
async function metaInsights(days=90){
  const {act,tok}=metaCfg();
  if(!act||!tok)throw new Error('광고 계정 번호와 액세스 토큰이 필요합니다.');
  const ck='meta:insights:'+act+':'+days;
  const hit=await idbGet(ck).catch(()=>null);
  if(hit&&Date.now()-hit.at<864e5)return hit.rows;      // 하루 안이면 재사용
  const until=new Date(), since=new Date(Date.now()-days*864e5);
  const iso=d=>d.toISOString().slice(0,10);
  const qs=new URLSearchParams({
    level:'campaign', time_increment:'1', limit:'500',
    fields:'campaign_id,campaign_name,spend,impressions,clicks,ctr',
    time_range:JSON.stringify({since:iso(since),until:iso(until)}),
    access_token:tok,
  });
  const r=await fetch(`${META_API}/act_${encodeURIComponent(act)}/insights?${qs}`);
  const j=await r.json();
  if(j.error)throw new Error(j.error.message||'Meta API 오류');
  const rows=(j.data||[]).map(d=>({
    id:d.campaign_id, name:d.campaign_name||'', d:d.date_start,
    spend:+d.spend||0, imp:+d.impressions||0, clk:+d.clicks||0, ctr:+d.ctr||0,
  }));
  await idbSet(ck,{at:Date.now(),rows});
  return rows;
}
/** 캠페인별 연령·성별 분해. /{campaign-id}/insights 에 breakdowns=age,gender 를 건다.
    광고를 클릭한 사람의 분포이지 책을 산 사람의 분포가 아니다 — 화면에도 그렇게 적는다. */
async function metaBreakdown(campaignIds,days=90){
  const {tok}=metaCfg(); if(!tok||!campaignIds.length)return [];
  const ck='meta:bd:'+campaignIds.slice(0,5).join(',')+':'+days;
  const hit=await idbGet(ck).catch(()=>null);
  if(hit&&Date.now()-hit.at<864e5)return hit.rows;
  const until=new Date(), since=new Date(Date.now()-days*864e5);
  const iso=d=>d.toISOString().slice(0,10);
  const out=[];
  for(const id of campaignIds.slice(0,5)){          // 캠페인이 많아도 5개까지만
    const qs=new URLSearchParams({
      breakdowns:'age,gender', fields:'impressions,clicks,spend', limit:'200',
      time_range:JSON.stringify({since:iso(since),until:iso(until)}),
      access_token:tok,
    });
    try{
      const r=await fetch(`${META_API}/${encodeURIComponent(id)}/insights?${qs}`);
      const j=await r.json();
      if(j.error)continue;                          // 한 캠페인이 실패해도 나머지는 살린다
      (j.data||[]).forEach(d=>out.push({
        age:d.age||'?', gender:d.gender||'unknown',
        imp:+d.impressions||0, clk:+d.clicks||0, spend:+d.spend||0,
      }));
    }catch(e){}
  }
  await idbSet(ck,{at:Date.now(),rows:out});
  return out;
}
const GENDER_KO={female:'여성',male:'남성',unknown:'미상'};
/** 분해 결과를 막대로. 클릭 기준으로 본다 — 노출은 예산 배분에 좌우된다. */
function bdBars(rows){
  if(!rows.length)return '';
  const byAge={}, byGen={};
  let tot=0;
  rows.forEach(r=>{ byAge[r.age]=(byAge[r.age]||0)+r.clk;
                    byGen[r.gender]=(byGen[r.gender]||0)+r.clk; tot+=r.clk; });
  if(!tot)return '';
  const ages=Object.entries(byAge).sort((a,b)=>a[0].localeCompare(b[0]));
  const gens=Object.entries(byGen).sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>[GENDER_KO[k]||k,v]);

/** 캠페인 이름에 책 제목이 들어 있으면 그 책 것으로 본다.
    자동 매칭이라 틀릴 수 있어 화면에 「이름으로 맞춘 것」이라고 밝힌다. */
function metaMatch(rows,title){
  const norm=t=>String(t||'').replace(/[\s,.·:：\-–—!?'"“”‘’()（）\[\]『』「」]/g,'');
  const core=norm(String(title).replace(/[（(\[][^）)\]]*[）)\]]/g,'').split(/[,·:：\-–—]/)[0]);
  if(core.length<2)return [];
  return rows.filter(r=>norm(r.name).includes(core));
}
/** 광고 집행 구간을 순위 그래프 밑에 막대로 깐다. */
function adOverlay(hist,ads){
  if(!ads.length)return '';
  const byDay={}; ads.forEach(a=>{byDay[a.d]=(byDay[a.d]||0)+a.spend;});
  const days=hist.map(e=>e.d);
  const mx=Math.max(...Object.values(byDay))||1;
  const W=680,H=44,L=6,R=46;
  const X=n=>L+(W-L-R)*(days.length<2?0:n/(days.length-1));
  const bw=Math.max(3,(W-L-R)/Math.max(days.length,1)*0.55);
  let g='';
  days.forEach((d,n)=>{
    const v=byDay[d]||0; if(!v)return;
    const h=Math.max(2,(v/mx)*(H-14));
    g+=`<rect x="${(X(n)-bw/2).toFixed(1)}" y="${(H-h-2).toFixed(1)}" width="${bw.toFixed(1)}"
      height="${h.toFixed(1)}" rx="1.5" fill="#3d87f5" opacity=".75"><title>${esc(d)} · ${fmt(Math.round(v))}원</title></rect>`;
  });
  const tot=ads.reduce((a,x)=>a+x.spend,0), imp=ads.reduce((a,x)=>a+x.imp,0);
  // 순위 회차가 없는 날의 광고는 그래프에 자리가 없다. 빠진 만큼을 밝힌다.
  const outside=Object.keys(byDay).filter(d=>!days.includes(d));
  const outSpend=outside.reduce((a,d)=>a+byDay[d],0);
  return `<h3 class="s">광고 집행 · 같은 구간</h3>
    <div class="chart" style="padding-top:0"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg></div>
    <p class="none">지출 <b>${fmt(Math.round(tot))}원</b> · 노출 <b>${fmt(imp)}</b>회.
      위 순위 그래프와 같은 날짜 축입니다 — 광고를 켠 날 순위가 실제로 움직였는지 겹쳐 보십시오.
      ${outside.length?`<br>다만 <b>${outside.length}일치(${fmt(Math.round(outSpend))}원)</b>는
        그 날 순위 자료가 없어 막대로 그리지 못했습니다. 순위 회차가 쌓이면 함께 보입니다.`:''}</p>`;
}

/** 순위와 검색량 중 어느 쪽이 먼저 움직였는지 본다. */
function leadLag(rank,trend){
  // 순위: 값이 작을수록 높다. 비교하려면 뒤집는다.
  const rMap={}; rank.forEach(x=>{ rMap[x.d]=x.r; });
  const tMap={}; trend.forEach(x=>{ tMap[x.d]=x.v; });
  const days=Object.keys(rMap).filter(d=>tMap[d]!=null).sort();
  if(days.length<4)return null;
  // 가장 크게 오른 날과 검색량이 가장 높았던 날을 견준다
  let bestRise=null;
  for(let i=1;i<days.length;i++){
    const a=rMap[days[i-1]], b=rMap[days[i]];
    if(a==null||b==null)continue;
    const g=a-b;
    if(g>=5&&(!bestRise||g>bestRise.g))bestRise={d:days[i],g};
  }
  if(!bestRise)return null;
  let peak=null;
  days.forEach(d=>{ if(!peak||tMap[d]>tMap[peak])peak=d; });
  const dd=(a,b)=>Math.round(
    (Date.parse(`${b.slice(0,4)}-${b.slice(4,6)}-${b.slice(6,8)}`)
    -Date.parse(`${a.slice(0,4)}-${a.slice(4,6)}-${a.slice(6,8)}`))/864e5);
  const gap=dd(peak,bestRise.d);
  if(Math.abs(gap)>10)return null;
  return {rise:bestRise, peak, gap};
}

/** 어떤 날짜가 상승일 기준 며칠 전인지 — 음수면 이전 */
function nearRise(dateStr,rises){
  if(!dateStr||!rises.length)return null;
  const t=Date.parse(`${dateStr.slice(0,4)}-${dateStr.slice(4,6)}-${dateStr.slice(6,8)}`);
  let best=null;
  rises.forEach(x=>{
    const rt=Date.parse(`${x.d.slice(0,4)}-${x.d.slice(4,6)}-${x.d.slice(6,8)}`);
    const gap=Math.round((rt-t)/864e5);
    if(gap>=0&&gap<=7&&(best==null||gap<best.gap))best={gap,...x};
  });
  return best;
}

/** 응답 어디에 있든 연령·성별 분포를 찾아낸다.
    공개 문서에 스키마가 다 나와 있지 않아, 키 이름을 넓게 훑는다. */
function findLoanGroups(o){
  const ages=[], genders=[];
  const walk=(v)=>{
    if(!v||typeof v!=='object')return;
    if(Array.isArray(v)){v.forEach(walk);return;}
    const keys=Object.keys(v);
    // {age:'20', gender:'남성', loanCnt:12} 같은 모양을 찾는다
    const cnt=v.loanCnt??v.loanCount??v.count??v.cnt;
    if(cnt!=null){
      const a=v.age??v.ageGroup??v.ageRange;
      const g=v.gender??v.sex;
      if(a!=null)ages.push({k:String(a),v:+cnt||0});
      if(g!=null)genders.push({k:String(g),v:+cnt||0});
    }
    keys.forEach(k=>walk(v[k]));
  };
  walk(o);
  const merge=(arr)=>{
    const m={}; arr.forEach(x=>{m[x.k]=(m[x.k]||0)+x.v;});
    return Object.entries(m).map(([k,v])=>({k,v})).filter(x=>x.v>0);
  };
  return {ages:merge(ages),genders:merge(genders)};
}

          :L.gap<0?'매대에 오른 뒤 사람들이 찾기 시작한 모양입니다.'

      <div class="trend">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <polyline points="${line}" fill="none" stroke="var(--gr)"
            stroke-width="1.2" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="trx"><span>${from.slice(5)}</span><span>${to.slice(5)}</span></div>

  }catch(e){
    box.innerHTML=`<h3 class="s">검색량 추이</h3>
      <p class="none">${esc(String(e.message||e)).replace(/\n/g,'<br>')}</p>`;

/* 키 없이 쓰는 표지 후보들.
   <img> 는 CORS 를 타지 않으므로 주소만 맞으면 바로 뜬다.
   앞에서부터 시도하고 실패하면 onerror 로 다음 것을 건다.
     1) 교보문고 — 국내서 커버리지가 가장 넓다. 비공식 주소라 언제든 바뀔 수 있다.
     2) 알라딘  — 같은 성격.
     3) Open Library — 공식 무료 API. 문서에 공개 페이지 표지용으로 쓰라고 적혀 있다.
        다만 국내서는 거의 없다. 원서·번역서 원본이 잡히는 정도.
   셋 다 없으면 카카오·네이버 키를 받아 정식으로 조회한다. */
const COVER_URLS=isbn=>{
  // 표지는 각 서점의 상품 ID 로 찾는다. 파일에 들어 있는 값을 쓴다.
  //
  // 알라딘을 앞에 둔다 — 이미지 서버가 열려 있어 가장 잘 뜬다.
  // 교보는 핫링크를 막는 때가 있어 뒤로 뺐다.
  const pid=(typeof shopPid==='function')?shopPid(isbn):{};
  const u=[];
  if(pid.a){
    u.push(`https://image.aladin.co.kr/cover/cover500/${pid.a}_1.jpg`);
    u.push(`https://image.aladin.co.kr/cover/cover200/${pid.a}_1.jpg`);
    u.push(`https://image.aladin.co.kr/coversum/${pid.a}_1.jpg`);
  }
  if(pid.y){
    u.push(`https://image.yes24.com/goods/${pid.y}/XL`);
    u.push(`https://image.yes24.com/goods/${pid.y}/L`);
  }
  if(pid.k)u.push(`https://contents.kyobobook.co.kr/sih/fit-in/458x0/pdt/${pid.k}.jpg`);
  u.push(`https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`);
  return u;
};
/** 후보 주소를 차례로 걸어 본다. 뜨면 그 자리에서 멈춘다. */
/** 표지를 크게 본다. 누르거나 ESC 로 닫는다. */
function zoomCover(src){
  if(!src)return;
  const w=document.createElement('div');
  w.className='cvzoom';
  w.innerHTML=`<img src="${esc(src)}" alt="표지" referrerpolicy="no-referrer">
    <button class="cvx" aria-label="닫기">✕</button>`;
  const close=()=>{ w.remove(); document.removeEventListener('keydown',esc2); };
  const esc2=e=>{ if(e.key==='Escape')close(); };
  w.addEventListener('click',close);
  document.addEventListener('keydown',esc2);
  document.body.appendChild(w);
}
/** 표지 칸에 확대 동작을 건다. 링크가 있으면 링크가 우선이다. */
function bindZoom(box){
  const img=box.querySelector('img');
  if(!img)return;
  // 서점 링크로 감싸여 있으면 그대로 둔다 — 상품 페이지로 가는 게 더 유용하다
  if(img.closest('a'))return;
  img.style.cursor='zoom-in';
  img.title='눌러서 크게 보기';
  img.onclick=e=>{ e.stopPropagation(); zoomCover(img.src); };
}

function tryCoverChain(isbn, box, onFail){
  const urls=COVER_URLS(isbn);
  let k=0;
  const img=new Image();
  img.referrerPolicy='no-referrer';       // 핫링크 차단을 피한다
  img.onload=()=>{
    if(CUR!==isbn)return;
    // 1px 짜리 빈 이미지를 돌려주는 곳이 있어 크기로 거른다
    if(img.naturalWidth<40||img.naturalHeight<40){ next(); return; }
    box.innerHTML=`<img src="${esc(img.src)}" alt="표지" referrerpolicy="no-referrer">`;
    box.hidden=false;
    bindZoom(box);
    idbSet('cover:'+isbn,{url:img.src,at:Date.now()}).catch(()=>{});
  };
  img.onerror=next;
  function next(){ k++; if(k<urls.length){ img.src=urls[k]; } else onFail(); }
  img.src=urls[0];
}

/** 표지 연결 — 설정까지 들어가지 않고 이 자리에서 키를 넣는다. */

    try{
      const r=await fetch(BOOKINFO_FN,{method:'POST',

        body:JSON.stringify({isbn,kakao:v})});

async function paintCover(isbn){
  const box=$('#coverbox'); if(!box)return;
  const cc=getCfg();
  const hasKey=(cc.kakaokey||'').trim()||((cc.nvid||'').trim()&&(cc.nvsec||'').trim());

  // 1) 캐시 — 있으면 즉시 띄운다
  const hit=await idbGet('cover:'+isbn).catch(()=>null);
  if(hit&&hit.url&&Date.now()-hit.at<7*864e5){
    box.innerHTML=`<img src="${esc(hit.url)}" alt="표지" referrerpolicy="no-referrer">`;
    box.hidden=false;
    bindZoom(box);
  }

  // 2) 무료 경로를 먼저 태운다.
  //    키가 있어도 이걸 건너뛰지 않는다 — 중계가 막히면 표지가 아예 안 뜨기 때문이다.
  tryCoverChain(isbn, box, ()=>{
    if(CUR!==isbn||box.querySelector('img'))return;
    if(hasKey){ box.hidden=true; return; }   // 아래 키 경로가 채운다
    box.innerHTML=`<button class="nocover" id="cvsetup">표지<br>연결하기</button>`;
    box.hidden=false;
    const bt=$('#cvsetup');
    if(bt)bt.onclick=(e)=>{e.stopPropagation();coverSetup(isbn);};
  });

  if(!hasKey)return;

  // 3) 키가 있으면 정식 조회로 덮어쓴다 — 판매 상태까지 온다
  //    카카오·네이버가 안 되면 알라딘·예스24 API 로도 찾는다.
  try{
    let c=null;
    try{ c=await bookInfo(isbn); }catch(e){ /* 아래에서 다른 서점을 본다 */ }

    if((!c||!c.url)&&alaKey()){
      try{
        const j=await alaLookup(isbn);
        if(j&&j.item&&j.item.cover)
          c={url:j.item.cover, link:j.item.link,
             status:j.item.stock||null, via:'aladin'};
      }catch(e){ /* 다음 */ }
    }
    if((!c||!c.url)&&y24Key()){
      try{
        const j=await y24Detail(isbn);
        if(j&&j.item&&j.item.cover)
          c={url:j.item.cover, link:j.item.link,
             status:j.item.st||null, via:'yes24'};
      }catch(e){ /* 다음 */ }
    }
    if(CUR!==isbn)return;
    if(!c||!c.url){
      // 어디서도 못 찾았다. 비워 두면 고장으로 보이니 다시 시도 버튼을 둔다.
      if(!box.querySelector('img')){
        box.innerHTML=`<button class="nocover" id="cvsetup">표지<br>다시 시도</button>`;
        box.hidden=false;
        const bt=$('#cvsetup');
        if(bt)bt.onclick=(ev)=>{ev.stopPropagation();
          idbDel('cover:'+isbn).catch(()=>{});paintCover(isbn);};
      }
      return;
    }
    const bad=c.status&&/절판|품절/.test(c.status);
    let h='';
    if(c.url)h+=`<img src="${esc(c.url)}" alt="표지" loading="lazy" referrerpolicy="no-referrer">`;
    if(c.status)h+=`<span class="stat${bad?' bad':''}">${esc(c.status)}</span>`;
    if(!h)return;
    box.innerHTML=c.link?`<a href="${esc(c.link)}" target="_blank" rel="noopener">${h}</a>`:h;
    box.hidden=false;
    bindZoom(box);
  }catch(e){
    // 중계가 막혀도 무료 경로가 이미 채웠을 수 있다. 비어 있을 때만 안내한다.
    if(CUR===isbn&&!box.querySelector('img')){
      box.innerHTML=`<button class="nocover" id="cvsetup">표지<br>다시 시도</button>`;
      box.hidden=false;
      const bt=$('#cvsetup');
      if(bt)bt.onclick=(ev)=>{ev.stopPropagation();idbDel('cover:'+isbn).catch(()=>{});paintCover(isbn);};
    }
  }
}

/** 표지와 판매 상태. 절판·품절은 마케팅 판단에 바로 쓰이는 신호다. */
/** 서지 응답 안의 표지 주소. 국립중앙도서관 기본 키로 받으므로
    카카오·네이버 설정이 없어도 표지가 뜬다. */
async function seojiCover(isbn){
  try{
    const v=await idbGet('seoji:'+isbn);
    const u=v&&v.raw&&cl(v.raw.TITLE_URL);
    // http(s) 든 //로 시작하든 상대경로든 받는다. 깨지면 onerror 가 숨긴다.
    return u&&u.length>4?u:null;
  }catch(e){ return null; }
}

const SEOJI='https://www.nl.go.kr/seoji/SearchApi.do';
/* 국립중앙도서관 서지 API 기본 키.
   공공 무료 서비스라 도용돼도 요금이 나가지 않아 파일에 심어 둔다.
   다른 키를 쓰시려면 자료 탭 「고급」에 넣으면 그쪽이 우선한다. */
const NL_KEY_DEFAULT='6e10b50a893b746cff86227155bd6e4b82e9a07408519b9b24b5c3fcfb2ec68f';
const nlKey=()=>((getCfg().nlkey||'').trim()||NL_KEY_DEFAULT);
async function seojiLookup(isbn){
  const key=nlKey();
  const cached=await idbGet('seoji:'+isbn);
  if(cached)return cached;                       // 서지는 잘 안 바뀐다 — 한 번만 받는다
  const qs=new URLSearchParams({cert_key:key,result_style:'json',
    page_no:'1',page_size:'1',isbn});
  const r=await fetch(`${SEOJI}?${qs}`);
  if(!r.ok)throw new Error(`서지 조회 실패 (${r.status})`);
  const j=await r.json();
  const d=(j.docs&&j.docs[0])||null;
  if(!d)throw new Error('이 ISBN으로 등록된 서지가 없습니다.');
  // 응답을 통째로 둔다. 필드 목록이 공개돼 있지 않아 고른 것만 쓰면 빠지는 게 생긴다.
  const out={
    raw:d,
    pd:String(d.PUBLISH_PREDATE||d.REAL_PUBLISH_DATE||'').replace(/[^0-9]/g,'').slice(0,8),
    kwds:cl(d.KEYWORD||'').split(/[;,·]/).map(s=>s.trim()).filter(Boolean).slice(0,14),
  };
  await idbSet('seoji:'+isbn,out);
  if(out.pd)SEOJI_PD[isbn]=out.pd;      // 신간·구간 판정이 이 날짜를 쓰게 한다
  return out;
}
/** 저장해 둔 서지 발행일을 시작할 때 한 번에 올린다. */
async function loadSeojiDates(){
  try{
    const keys=(await idbKeys()).filter(k=>String(k).startsWith('seoji:'));
    for(const k of keys){
      const v=await idbGet(k);
      if(v&&v.pd)SEOJI_PD[k.slice(6)]=v.pd;
    }
  }catch(e){}
}
/* 국립중앙도서관 서지 필드 이름. 아는 것만 한글로 바꾸고, 모르는 키는 그대로 보여준다.
   순서도 여기 적힌 대로 나온다 — 목록에 없는 필드는 뒤에 붙는다. */
const SEOJI_LABEL={
  TITLE:'서명', TITLE_SUB:'부서명', SERIES_TITLE:'총서명', SERIES_NO:'총서 번호',
  VOL:'권차', AUTHOR:'저자', TITLE_AUTHOR_ALIAS:'저자 별칭',
  PUBLISHER:'발행처', PUBLISH_PREDATE:'발행예정일', REAL_PUBLISH_DATE:'실제 발행일',
  EDITION_STMT:'판 사항', PAGE:'쪽수', BOOK_SIZE:'판형', FORM:'형태',
  PRE_PRICE:'예정가', EA_ISBN:'낱권 ISBN', EA_ADD_CODE:'부가기호',
  SET_ISBN:'세트 ISBN', SET_ADD_CODE:'세트 부가기호', SET_EXPRESSION:'세트 표현',
  SUBJECT:'주제', KDC:'KDC 분류', DDC:'DDC 분류', CLASS_NO:'분류기호',
  KEYWORD:'키워드', BOOK_INTRODUCTION:'책 소개', BOOK_SUMMARY:'요약',
  LANGUAGE:'본문 언어', ORIGINAL_TITLE:'원서명',
  CIP_YN:'CIP 여부', DEPOSIT_YN:'납본 여부', PROD_CLASS:'발행형태',
  INPUT_DATE:'등록일', UPDATE_DATE:'수정일',
  TITLE_URL:'표지 이미지', BOOK_TB_CNT_URL:'목차', BOOK_INTRODUCTION_URL:'책 소개',
  BOOK_SUMMARY_URL:'요약', PUBLISHER_URL:'출판사 링크', AUTHOR_URL:'저자 소개',
  BOOK_INDEX_URL:'찾아보기', BOOK_PUBLISHER_URL:'출판사 서평',
};
const SEOJI_YN={Y:'예', N:'아니오'};
// 표지는 위쪽 표지 칸을 눌러 크게 보므로 표에서는 뺀다.
const SEOJI_SKIP=new Set(['KEYWORD','TITLE_URL']);
const isUrlKey=k=>/_URL$/.test(k);
/** 받아온 서지를 빠짐없이 표로 만든다. */
function seojiRows(d){
  const seen=new Set(), out=[];
  const put=(k)=>{
    if(seen.has(k)||SEOJI_SKIP.has(k))return;
    seen.add(k);
    let v=cl(d[k]);
    if(!v)return;
    const label=SEOJI_LABEL[k]||k;
    if(isUrlKey(k)){
      out.push(`<tr><td class="lb">${esc(label)}</td><td class="vl">
        <a href="${esc(v)}" target="_blank" rel="noopener" style="color:var(--gr)">열기</a></td></tr>`);
      return;
    }
    if(/^(CIP_YN|DEPOSIT_YN)$/.test(k))v=SEOJI_YN[v]||v;
    if(k==='PRE_PRICE'&&/^[0-9]+$/.test(v))v=fmt(+v)+'원';
    if(/DATE$/.test(k)){
      const n=v.replace(/[^0-9]/g,'');
      if(n.length===8)v=`${n.slice(0,4)}.${n.slice(4,6)}.${n.slice(6,8)}`;
    }
    out.push(`<tr><td class="lb">${esc(label)}</td><td class="vl">${esc(v)}</td></tr>`);
  };
  Object.keys(SEOJI_LABEL).forEach(put);        // 아는 순서대로 먼저
  Object.keys(d).forEach(put);                  // 나머지는 뒤에
  return out.join('');
}

/* 서점 판매 링크. 상품 상세 주소는 서점마다 내부 코드가 필요해 깨지기 쉬우므로
   ISBN 검색 주소를 쓴다 — 코드가 없어도 언제나 열린다. */
/* 서점 링크.
   원본 파일에 상품 ID 가 들어 있으면 상세 페이지로 바로 간다.
   없으면 ISBN 검색으로 떨어진다 — 예스24·쿠팡은 ID 를 안 주므로 늘 검색이다. */
const SHOPS=[
  ['교보문고','k', (i,pid)=>pid
      ? `https://product.kyobobook.co.kr/detail/${pid}`
      : `https://search.kyobobook.co.kr/search?keyword=${i}&gbCode=TOT`],
  ['예스24','y', (i,pid)=>pid
      ? `https://www.yes24.com/product/goods/${pid}`
      : `https://www.yes24.com/product/search?query=${i}`],
  ['알라딘','a', (i,pid)=>pid
      ? `https://www.aladin.co.kr/shop/wproduct.aspx?ItemId=${pid}`
      : `https://www.aladin.co.kr/search/wsearchresult.aspx?SearchTarget=Book&SearchWord=${i}`],
  // 쿠팡은 상품 번호가 원본 자료에 없다. 쿠팡 자체 번호라 만들 수도 없어
  // 검색으로만 연다. 대신 정확도가 올라가는 값을 붙였다.
  ['쿠팡','', (i)=>`https://www.coupang.com/np/search?q=${i}&channel=user&sorter=scoreDesc&listSize=36`],
  // 알라딘 중고 — 되팔림이 있는지 보면 실수요를 가늠할 수 있다.
  ['알라딘 중고','a', (i,pid)=>pid
      ? `https://www.aladin.co.kr/shop/UsedShop/wuseditemall.aspx?ItemId=${pid}`
      : `https://www.aladin.co.kr/search/wsearchresult.aspx?SearchTarget=UsedStore&SearchWord=${i}`],
];
/** 이 책의 서점별 상품 ID 를 회차 기록에서 찾는다. 최근 회차부터 뒤로 훑는다. */
function shopPid(isbn){
  const out={};
  for(const per of ['daily','weekly','monthly','annual']){
    const set=SETS[per]||[];
    for(let i=set.length-1;i>=0;i--){
      const row=(set[i].rows||[]).find(x=>x.i===isbn);
      if(row&&row.pid)Object.keys(row.pid).forEach(k=>{ if(!out[k])out[k]=row.pid[k]; });
      if(out.k&&out.a)return out;
    }
  }
  return out;
}
function shopLinks(isbn){
  const pid=shopPid(isbn);
  const direct=SHOPS.filter(([,k])=>k&&pid[k]).length;
  return `<h3 class="s">상품 페이지</h3>
    <div class="shops">
      ${SHOPS.map(([n,k,f])=>{
        const u=f(isbn, k?pid[k]:null);
        const d=!!(k&&pid[k]);
        return `<a href="${esc(u)}" target="_blank" rel="noopener"${d?' class="direct"':''}>${n}</a>`;
      }).join('')}
    </div>
    <p class="none">${direct?`<b>→</b> 표시는 상품 페이지로 바로 갑니다.
      나머지는 ISBN 검색으로 엽니다.`:'ISBN으로 검색해 엽니다. 판본이 여럿이면 결과에 함께 나옵니다.'}</p>`;
}

async function runSeoji(isbn,sel,noTitle){
  // 도서 상세 아래쪽과 「서지 세부 정보」 두 곳에서 쓴다.
  const box=$(sel||'#seojibox');
  if(!box)return;
  box.innerHTML='<p class="src">서지 정보를 받는 중…</p>';

    // 이 발행일로 신간·구간을 다시 판정한다
    const b=DB.hist[isbn]||{}, shopPd=b.pd||'';
    const n=s.pd?age(s.pd,new Date()):null;
    const tag=n==null?null:ageTag(n,false);

      ${(sel&&!noTitle)||noTitle?'':'<h3 class="s" style="padding-left:0">서지 정보</h3>'}
      <table class="seoji"><tbody>${seojiRows(d)}</tbody></table>
      ${diff?`<p class="none" style="padding:8px 0 0">서점 파일의 날짜(${shopPd.slice(0,4)}.${shopPd.slice(4,6)}.${shopPd.slice(6,8)})와
        다릅니다. 판정에는 <b>서지 쪽 발행일</b>을 씁니다 — 출판사가 등록한 원본이라서입니다.</p>`:''}
      ${s.kwds.length?`<div class="chips" style="margin:12px 0 0">
        ${s.kwds.map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div>
        <p class="none" style="padding:8px 0 0">출판사가 직접 등록한 키워드입니다.
          서점 분류와 다를 수 있고, 그 차이 자체가 포지셔닝의 단서가 됩니다.</p>`:''}
      <p class="src">국립중앙도서관 제공 · 응답에 담긴 항목을 모두 표시합니다</p>`;
    paint();   // 판정이 바뀌었을 수 있으니 목록·리포트를 다시 그린다
    paintCover(isbn);   // 서지에 표지가 딸려 왔을 수 있다
  }catch(e){
    // 접기를 열었는데 비어 있으면 고장으로 보인다. 왜 안 됐는지 적는다.
    box.innerHTML=`<p class="none" style="padding:0">
      서지 정보를 받지 못했습니다 — ${esc(String(e.message||e)).slice(0,120)}</p>`;
  }
}

/* ── 주요 성과 ─────────────────────────────────────────────
   레퍼런스의 서점 배지처럼 짧은 키워드로 보여 준다.
   서점별 최고 순위는 적재된 자료에서 자동으로 뽑고,
   MD 추천·기획전·굿즈·수상처럼 손으로 확인한 것은 그 뒤에 붙인다. */
const ACHKIND={
  md:'MD 추천', event:'기획전', goods:'굿즈', award:'수상',
  best:'기록', press:'언론', fund:'펀딩', sign:'행사',
};
/** 서점별 최고 순위 — 전 회차를 훑어 가장 높았던 자리를 찾는다. */
function bestRanks(isbn){
  const h=(DB.hist[isbn]||{}).h||[];
  const out=[];
  [['k','교보문고'],['y','예스24'],['a','알라딘']].forEach(([key,name])=>{
    const v=h.map(x=>x[key]).filter(x=>x!=null);
    if(v.length)out.push(`${name} ${Math.min(...v)}위`);
  });
  return out;
}
function achBox(isbn){
  const P=(DB.paths||{})[isbn];
  const ranks=bestRanks(isbn);
  const A=(P&&P.ach)||[];
  if(!ranks.length&&!A.length)return '';
  const chip=(t,strong)=>`<span class="crn${strong?' hi':''}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4.5 3.5L12 5l4.5 6.5L21 8l-1.6 9.5H4.6L3 8z"/></svg>
    ${t}</span>`;
  return `<div class="crns">
      ${ranks.map(t=>chip(esc(t),true)).join('')}
      ${A.map(x=>chip(
        `<em>${esc(ACHKIND[x.k]||x.k)}</em> ${x.t}${x.d?` <i>${esc(x.d)}</i>`:''}`)).join('')}
    </div>
    <p class="none" style="padding-top:9px">
      ${ranks.length?'순위는 적재된 회차에서 가장 높았던 자리입니다.':''}
      ${A.length?' 나머지는 서점 상품 페이지에 표기된 것을 옮겨 적었습니다.':''}</p>`;
}

function pathCard(isbn){

/* ── 설정 동기화 ───────────────────────────────────────────
   API 키를 서버에 그냥 두면 안 된다. 이 앱의 Supabase 접속 키는
   HTML 안에 들어 있어서, 표를 읽을 수 있는 사람이 곧 키를 갖게 된다.

   그래서 브라우저에서 먼저 암호화한다.
     관리자 비밀번호 → PBKDF2(21만 회) → AES-GCM 키
   서버에는 암호문·초기화벡터·소금만 올라간다.
   복호화에 필요한 비밀번호는 서버 어디에도 없다.

   덕분에 다른 기기에서도 비밀번호만 알면 키를 그대로 받아 쓸 수 있다. */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));

async function deriveKey(pw,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),
    'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
/** 지금 기기의 키 묶음을 암호화해 서버에 올린다. */
async function cfgPush(pw){
  const c=getCfg();
  // 저장할 것만 골라 담는다. 화면 상태 같은 건 올리지 않는다.
  const KEYS=['kakaokey','nvid','nvsec','ytkey','y24key','alakey',
              'libkey','metaAct','metaTok','gsUrl','aimodel','aiws'];
  const box={}; KEYS.forEach(k=>{ if((c[k]||'').trim())box[k]=c[k]; });
  if(!Object.keys(box).length)throw new Error('올릴 키가 없습니다.');

  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pw,salt);
  const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,
    new TextEncoder().encode(JSON.stringify(box)));

  const r=await fetch(`${SB_URL}/rest/v1/settings`,{
    method:'POST',
    headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,
      'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},
    body:JSON.stringify({id:'keys',cipher:b64(cipher),iv:b64(iv),salt:b64(salt)})});
  if(!r.ok)throw new Error(`올리지 못했습니다 · ${r.status} ${(await r.text()).slice(0,120)}`);
  return Object.keys(box).length;
}
/** 서버에서 받아 복호화해 이 기기에 넣는다. */
async function cfgPull(pw){
  const r=await fetch(`${SB_URL}/rest/v1/settings?id=eq.keys&select=*`,
    {headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`}});
  if(!r.ok)throw new Error(`받지 못했습니다 · ${r.status}`);
  const row=(await r.json())[0];
  if(!row)throw new Error('서버에 저장된 설정이 없습니다.');
  const key=await deriveKey(pw,unb64(row.salt));
  let plain;
  try{
    plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(row.iv)},key,unb64(row.cipher));
  }catch(e){
    throw new Error('비밀번호가 맞지 않습니다. 올릴 때 쓴 비밀번호로 풀어야 합니다.');
  }
  const box=JSON.parse(new TextDecoder().decode(plain));
  setCfg(Object.assign(getCfg(),box));
  return {n:Object.keys(box).length, at:row.updated_at};
}

  const out=[];
  for(let i=h+1;i<aoa.length;i++){
    const r=aoa[i],get=k=>C[k]!=null?r[C[k]]:null;
    const rk=parseInt(get('r'),10); if(!isFinite(rk))continue;
    const ib=ib13(get('i')); if(!ib)continue;      // 음반·문구는 여기서 걸러진다
    out.push(mkrow(rk,ib,cl(get('t')),cl(get('au')),cl(get('p')),num(get('pr')),
      String(get('pd')??'').replace(/[^0-9]/g,'').slice(0,8),get('g'),num(get('s'))));
    if(out.length>=cap)break;
  }
  return out;
}
/** 파일 하나 → 캐시에 넣을 항목. 재구성 때 원본을 다시 안 읽어도 되게 만든다. */
function parseEntry(id,path,name,buf){
  const kind=kindOf(path)||kindOf(name);
  if(!kind)return null;
  const aoa=aoaOf(buf);
  const rows=kind==='yes'?pYes24(aoa,CAP.yes)
            :kind==='al' ?pAladin(aoa,CAP.al)
                         :pKyobo(aoa,CAP[kind]);
  return {id,kind,name:name.replace(/\.(xlsx|xls)$/i,''),rows};
}

/* ── 재구성 ── */
function addIndex(r,kind,label,src,year){
  const b=DB.hist[r.i]||(DB.hist[r.i]={t:r.t,au:r.au,p:r.p,g:r.g,pd:r.pd,pr:r.pr,h:[]});
  ['au','p','pd','pr'].forEach(f=>{if(!b[f]&&r[f])b[f]=r[f];});
  if(kind==='annual')(b.an||(b.an=[])).push({y:year,r:r.r});
  else if(kind==='weekly')(b.wk||(b.wk=[])).push({l:`${label} (${src})`,r:r.r,s:r.s});
  else (b.dy||(b.dy=[])).push({l:`${label} (${src})`,r:r.r});
}
function applyEntry(e,ctx){
  if(e.kind==='auto'){                      // 자동 수집기가 만든 완성 회차
    const rd=e.round;
    if(ctx.days.has(`${rd.y}-${rd.m}-${rd.d}`)){ctx.skip++;return;}   // 3사 통합본 우선
    rd.rows.forEach(r=>addIndex(r,'daily',`${rd.y}-${rd.m}-${rd.d}`,rd.src||'자동'));
    DB.daily.push(rd);
    ctx.days.add(`${rd.y}-${rd.m}-${rd.d}`);
    return;
  }
  const nm=e.name;
  if(e.kind==='ka'){
    const mm=nm.match(/(20[0-2]\d)/); if(!mm)return;
    const real=String(4025-(+mm[1]));                  // 파일명 거울 뒤집힘 교정
    ctx.tops[real]=e.rows.length?e.rows[0].t:'?';
    e.rows.forEach(r=>addIndex(r,'annual',real,'교보',real));
    const item={y:real,label:`${real}년`,rows:e.rows,
      note:'교보문고 연간 종합 기준입니다.'};
    const at=DB.annual.findIndex(a=>a.y===real);
    if(at>=0)DB.annual[at]=item; else DB.annual.push(item);
  }else if(e.kind==='kw'){
    const mm=nm.match(/\((\d+)\)/), seq=mm?+mm[1]:1;
    const ws=new Date(2025,7,13); ws.setDate(ws.getDate()+7*(seq-1));
    const we=new Date(ws); we.setDate(we.getDate()+6);
    let warn='';
    const mx=e.rows.map(r=>r.pd).filter(d=>d&&d.length===8).sort().pop();
    if(mx){
      const d=new Date(+mx.slice(0,4),+mx.slice(4,6)-1,+mx.slice(6,8));
      if(d-we>90*864e5){warn=' ⚠';ctx.warns.push(`순번 ${seq} · 최신 발행일 ${mx} — 추정 주차보다 지나치게 미래`);}
    }
    const label=`${pad(ws.getMonth()+1)}월 ${pad(ws.getDate())}일~${pad(we.getMonth()+1)}월 ${pad(we.getDate())}일${warn}`;
    const sl=(ws.getMonth()===we.getMonth()
      ?`${pad(ws.getDate())}일~${pad(we.getDate())}일`
      :`${pad(ws.getMonth()+1)}.${pad(ws.getDate())}~${pad(we.getMonth()+1)}.${pad(we.getDate())}`)+warn;
    e.rows.forEach(r=>addIndex(r,'weekly',`${ws.getFullYear()}.${label}`,'교보'));
    DB.weekly.push({y:String(ws.getFullYear()),m:pad(ws.getMonth()+1),
      w:String(Math.floor((ws.getDate()-1)/7)+1),label,sl,src:'교보',
      note:`교보문고 주간 종합. 주차는 파일 순번 ${seq} 기반 추정입니다.`
        +(warn?' ⚠ 아래 검증 목록을 확인해 주십시오.':''),rows:e.rows});
  }else if(e.kind==='yes'){
    const mm=nm.match(/(20\d{2})\D?(\d{2})\D?(\d{2})/); if(!mm)return;
    const y=mm[1],m=mm[2],d=mm[3];
    if(ctx.days.has(`${y}-${m}-${d}`)){ctx.skip++;return;}   // 3사 통합본이 우선
    e.rows.forEach(r=>addIndex(r,'daily',`${y}-${m}-${d}`,'예스24'));
    DB.daily.push({y,m,d,label:`${+m}월 ${+d}일`,src:'예스24',rows:e.rows,
      note:'예스24 종합 순위입니다.'});
    ctx.days.add(`${y}-${m}-${d}`);
  }else{
    // 「1999년 9월 5주_…」 같은 파일명에서 연·월·주만 뽑는다. 1900년대도 받는다.
    const my=nm.match(/(?:19|20)\d{2}/), mo=nm.match(/(\d{1,2})\s*월/), mw=nm.match(/(\d{1,2})\s*주/);
    const md=nm.match(/(20\d{2})\D?(\d{2})\D?(\d{2})/);
    if(md){                                   // 날짜가 박힌 일별 파일이면 일간으로
      const y=md[1],m=md[2],d=md[3];
      if(ctx.days.has(`${y}-${m}-${d}`)){ctx.skip++;return;}
      e.rows.forEach(r=>addIndex(r,'daily',`${y}-${m}-${d}`,'알라딘'));
      DB.daily.push({y,m,d,label:`${+m}월 ${+d}일`,src:'알라딘',rows:e.rows,
        note:`알라딘 지금베스트. 상위 ${CAP.al}위까지 적재합니다.`});
      ctx.days.add(`${y}-${m}-${d}`);
      return;
    }
    const y=my?my[0]:'0000';
    const m=pad(mo?Math.min(Math.max(+mo[1],1),12):1);
    const w=String(mw?Math.min(Math.max(+mw[1],1),5):1);
    const known=y!=='0000';
    const label=known?`${+m}월 ${w}주`:'날짜 미상';
    const full =known?`${y}.${m} ${w}주`:'날짜 미상';
    e.rows.forEach(r=>addIndex(r,'weekly',full,'알라딘'));
    DB.weekly.push({y,m,w,label,sl:known?`${w}주차`:'날짜 미상',src:'알라딘',
      note:`알라딘 주간베스트. 상위 ${CAP.al}위까지 적재합니다.`
        +(known?'':' 파일명에서 날짜를 못 찾았습니다.'),rows:e.rows});
  }
}
function rebuildMonthly(){
  const grp={};
  DB.daily.forEach(d=>{const k=`${d.y}|${d.m}|${d.src||''}`;(grp[k]||(grp[k]=[])).push(d);});
  DB.monthly=Object.entries(grp).map(([k,ds])=>{
    const parts=k.split('|'), y=parts[0], m=parts[1], src=parts[2];
    let depth=0; ds.forEach(d=>d.rows.forEach(x=>{if(x.r>depth)depth=x.r;}));
    const agg={};
    ds.forEach(d=>d.rows.forEach(x=>{
      const key=x.i||x.t, a=agg[key]||(agg[key]={sc:0,n:0,best:1e9,sum:0,x});
      a.sc+=depth+1-x.r; a.n++; a.sum+=x.r; a.best=Math.min(a.best,x.r);
      if(x.s!=null)a.x=x;
    }));
    const rows=Object.values(agg).sort((p,q)=>q.sc-p.sc).map((a,n)=>Object.assign({},a.x,
      {r:n+1,mn:a.n,mb:a.best,mavg:Math.round(a.sum/a.n*10)/10,sr:null,dl:null,st:''}));
    ds.sort((p,q)=>p.d<q.d?-1:1);
    return {y,m,src:src||undefined,label:`${y}년 ${m}월`,rows,
      note:`${ds.length}개 회차 합산 (${ds[0].label} ~ ${ds[ds.length-1].label}) · 깊이 ${depth}위. `+DB.monthNote};
  }).sort((p,q)=>(p.y+p.m+(p.src?'0'+p.src:'1')).localeCompare(q.y+q.m+(q.src?'0'+q.src:'1')));
}
/** 반기 — 월간과 같은 방식, 1~6월/7~12월로 묶는다 */

    const agg={};
    ds.forEach(d=>d.rows.forEach(x=>{
      const key=x.i||x.t, a=agg[key]||(agg[key]={sc:0,n:0,best:1e9,sum:0,x});
      a.sc+=depth+1-x.r; a.n++; a.sum+=x.r; a.best=Math.min(a.best,x.r);
      if(x.s!=null)a.x=x;
    }));
    const rows=Object.values(agg).sort((p,q)=>q.sc-p.sc).map((a,n)=>Object.assign({},a.x,
      {r:n+1,mn:a.n,mb:a.best,mavg:Math.round(a.sum/a.n*10)/10,sr:null,dl:null,st:''}));
    ds.sort((p,q)=>p.d<q.d?-1:1);
    return {y,h:hh,src:src||undefined,label:`${y}년 ${hh==='H1'?'상반기':'하반기'}`,rows,
      note:`${ds.length}개 회차 합산 (${ds[0].label} ~ ${ds[ds.length-1].label}) · 깊이 ${depth}위. `
        +'반기는 해당 반기 안의 일간 회차 점수 합으로 냅니다. 서점이 집계한 반기 순위가 아닙니다.'};
  }).sort((p,q)=>(p.y+p.h+(p.src?'0'+p.src:'1')).localeCompare(q.y+q.h+(q.src?'0'+q.src:'1')));
}
/** 캐시에 있는 모든 항목으로 화면 전체를 다시 만든다. */
function rebuildAll(entries){
  DB.daily=JSON.parse(JSON.stringify(BASE.daily));
  DB.weekly=JSON.parse(JSON.stringify(BASE.weekly));
  DB.annual=JSON.parse(JSON.stringify(BASE.annual));
  DB.hist=JSON.parse(JSON.stringify(BASE.hist));
  const ctx={tops:{},warns:[],skip:0,days:new Set(DB.daily.map(d=>`${d.y}-${d.m}-${d.d}`))};
  entries.forEach(e=>{try{applyEntry(e,ctx);}catch(err){}});

  rebuildMonthly();
  rebuildHalf();
  SETS.daily=DB.daily; SETS.weekly=DB.weekly; SETS.monthly=DB.monthly; SETS.half=DB.half; SETS.annual=DB.annual;
  Object.keys(idx).forEach(k=>idx[k]=Math.max(SETS[k].length-1,0));

}
async function cachedEntries(){
  const keys=(await idbKeys()).filter(k=>String(k).startsWith('f:'));
  const out=[];
  for(const k of keys){const v=await idbGet(k); if(v)out.push(v);}
  out.sort((a,b)=>String(a.id).localeCompare(String(b.id)));

/* ── 드라이브 ── */
function loadZip(){
  return new Promise((ok,no)=>{
    if(window.JSZip)return ok();
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload=()=>ok();
    s.onerror=()=>no(new Error('압축 해제기를 못 불러왔습니다. 인터넷 연결을 확인해 주세요.'));
    document.head.appendChild(s);
  });
}
/** 고른 것들을 「엑셀 한 장」 목록으로 편다. zip 이면 안을 펼친다. */
async function collect(files){
  const out=[];
  for(const f of [...files]){
    if(/\.zip$/i.test(f.name)){
      await loadZip();
      const z=await JSZip.loadAsync(f), ents=[];
      z.forEach((p,e)=>{
        const base=p.split('/').pop();
        if(!e.dir&&/\.(xlsx|xls)$/i.test(base)&&!base.startsWith('~')&&!p.startsWith('__MACOSX'))
          ents.push([p,e]);
      });
      ents.forEach(([p,e])=>out.push({name:p.split('/').pop(),path:p,buf:()=>e.async('arraybuffer')}));
    }else if(/\.(xlsx|xls)$/i.test(f.name)&&!f.name.startsWith('~$')){
      out.push({name:f.name,path:f.webkitRelativePath||f.name,buf:()=>f.arrayBuffer()});
    }
  }
  return out;
}
function loadXLSX(){
  return new Promise((ok,no)=>{
    if(window.XLSX)return ok();
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>ok();
    s.onerror=()=>no(new Error('엑셀 해석기를 못 불러왔습니다. 인터넷 연결을 확인해 주세요.'));
    document.head.appendChild(s);
  });
}
function b64buf(b64){
  const bin=atob(b64),n=bin.length,u=new Uint8Array(n);
  for(let i=0;i<n;i++)u[i]=bin.charCodeAt(i);
  return u.buffer;
}
async function gasCall(url,qs){
  const r=await fetch(url+(url.includes('?')?'&':'?')+qs);
  if(!r.ok)throw new Error(`스크립트 호출 실패 (${r.status}). 웹 앱 배포의 액세스 권한이 「모든 사용자」인지 확인해 주세요.`);
  const j=await r.json();
  if(j&&j.ok===false)throw new Error(`스크립트가 오류를 돌려줬습니다 — ${j.error||''}`);
  return j;
}
/** 두 연결 방식을 같은 모양으로 감싼다. */
function source(cfg){
  if(cfg.gas)return{
    kind:'스크립트',
    list:async()=>(await gasCall(cfg.gas,'list=1')).files||[],
    get:async id=>b64buf((await gasCall(cfg.gas,'id='+encodeURIComponent(id))).b64)
  };
  return{
    kind:'API 키',
    list:()=>driveList(cfg.folderId,cfg.key,'',[]),
    get:async id=>{
      const r=await fetch(`${DRIVE}/${id}?alt=media&key=${encodeURIComponent(cfg.key)}`);
      if(!r.ok)throw new Error(`내려받기 실패 ${r.status}`);
      return r.arrayBuffer();
    }
  };
}
async function driveList(folder,key,path,out){
  let tok='';
  do{
    const q=encodeURIComponent(`'${folder}' in parents and trashed=false`);
    const r=await fetch(`${DRIVE}?q=${q}&fields=nextPageToken,files(id,name,mimeType,modifiedTime)`
      +`&pageSize=1000&key=${encodeURIComponent(key)}${tok?'&pageToken='+tok:''}`);
    if(!r.ok){
      const hint=r.status===403?'폴더가 「링크가 있는 모든 사용자 · 뷰어」로 공개돼 있는지, API 키에 Drive API 가 켜져 있는지 확인해 주세요.'
        :r.status===404?'폴더 ID 가 맞는지 확인해 주세요.':'';
      throw new Error(`드라이브 목록 조회 실패 (${r.status}). ${hint}`);
    }
    const j=await r.json();
    for(const f of j.files||[]){
      if(f.mimeType==='application/vnd.google-apps.folder')await driveList(f.id,key,path+'/'+f.name,out);
      else if(/\.(xlsx|xls)$/i.test(f.name))out.push(Object.assign({},f,{path:path+'/'+f.name}));
    }
    tok=j.nextPageToken||'';
  }while(tok);
  return out;
}
async function pool(items,n,fn,prog){
  let i=0,done=0;
  await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{
    while(i<items.length){
      const k=i++;
      try{await fn(items[k]);}catch(e){LOG.push(`${items[k].name} · ${e.message}`);}
      if(prog)prog(++done);
    }
  }));
}
/** 자동 수집기가 쌓은 회차를 읽어 합친다. 저장소 주소 하나만 있으면 된다. */
async function repoSync(quiet){
  const url=(getCfg().repo||'').trim();
  if(!url)return 0;
  const st=$('#syncst');
  try{
    const r=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now());
    if(!r.ok)throw new Error(`수집 자료를 못 읽었습니다 (${r.status})`);
    const rounds=await r.json();
    if(!Array.isArray(rounds))throw new Error('형식이 다릅니다. data/daily.json 주소인지 확인해 주세요.');
    let n=0;
    for(const rd of rounds){
      if(!rd.rows||!rd.rows.length)continue;
      await idbSet('f:auto:'+rd.y+rd.m+rd.d+(rd.src||''),
        {id:'auto:'+rd.y+rd.m+rd.d,kind:'auto',round:rd});
      n++;
    }
    await idbSet('synced',new Date().toISOString());
    if(!quiet)show(`<div class="okbox"><b>자동 수집분 ${n}회차</b>${esc(rounds[rounds.length-1].label||'')}까지 받았습니다.</div>`);
    return n;
  }catch(e){
    if(!quiet)show(`<div class="okbox bad"><b>수집 자료 읽기 실패</b>${esc(e.message)}</div>`);
    return 0;
  }
}
async function driveSync(quiet){
  const cfg=getCfg(), st=$('#syncst');
  if(!cfg.gas&&!cfg.key){
    if(!quiet)show('<p class="none">스크립트 주소 또는 API 키 중 하나를 먼저 넣어 주세요.</p>'); return; }
  const SRC=source(cfg);
  try{
    await loadXLSX();
    st.textContent='드라이브 목록 조회 중…';
    const files=await SRC.list();
    const man=(await idbGet('manifest'))||{};
    const need=files.filter(f=>man[f.id]!==f.modifiedTime);
    const gone=Object.keys(man).filter(id=>!id.startsWith('local:')&&!files.some(f=>f.id===id));
    for(const id of gone){ await idbDel('f:'+id); delete man[id]; }
    if(!need.length&&!gone.length){
      st.textContent=`드라이브와 같음 · 파일 ${files.length}개`;
      if(!quiet)show(`<div class="okbox"><b>이미 최신입니다</b>드라이브 파일 ${files.length}개 · 새로 받을 것 없음</div>`);
      return;
    }
    LOG=[];
    await pool(need,cfg.gas?4:6,async f=>{
      const e=parseEntry(f.id,f.path||f.name,f.name,await SRC.get(f.id));
      if(e)await idbSet('f:'+f.id,e);
      man[f.id]=f.modifiedTime;
    },d=>{
      st.textContent=`내려받는 중 ${d} / ${need.length}`;
      if(!quiet)show(`<div class="prog"><span style="width:${(d/need.length*100).toFixed(1)}%"></span></div>
        <p class="none">${d} / ${need.length} 내려받는 중…</p>`);
    });
    await idbSet('manifest',man);
    const now=new Date();
    await idbSet('synced',now.toISOString());
    const ctx=rebuildAll(await cachedEntries());
    st.textContent=`드라이브 동기화 ${pad(now.getMonth()+1)}/${pad(now.getDate())} `
      +`${pad(now.getHours())}:${pad(now.getMinutes())} · 파일 ${files.length}개`;
    if(!quiet)show(report(ctx,{n:files.length,got:need.length,del:gone.length}));
  }catch(e){
    st.textContent='동기화 실패';
    if(!quiet)show(`<div class="okbox bad"><b>동기화 실패</b>${esc(e.message)}</div>`);
  }
}
function report(ctx,s){
  const yl=Object.keys(ctx.tops).sort();
  return `<div class="okbox"><b>적재 완료</b>
      대상 파일 ${s.n}개 · 새로 읽음 ${s.got} · 지워짐 ${s.del}<br>
      일간 ${DB.daily.length} · 주간 ${DB.weekly.length} · 월간 ${DB.monthly.length} · 연간 ${DB.annual.length}
      · 검색 대상 ${Object.keys(DB.hist).length}종</div>
    ${yl.length?`<h3 class="s">연도별 1위 — 거울 교정 결과를 확인해 주십시오</h3>
      <table class="mini"><tbody>${yl.map(y=>`<tr><td>${y}년</td><td>${esc(ctx.tops[y])}</td></tr>`).join('')}</tbody></table>
      <p class="none">아는 연도의 1위가 맞게 붙어 있으면 교정이 성공한 것입니다. 어긋난 줄이 보이면 알려 주십시오.</p>`:''}
    ${ctx.warns.length?`<h3 class="s">주차 추정 이상치 ${ctx.warns.length}건</h3>
      <p class="none">${ctx.warns.map(esc).join('<br>')}</p>`:''}
    ${LOG.length?`<h3 class="s">못 읽은 파일 ${LOG.length}건</h3>
      <p class="none">${LOG.slice(0,40).map(esc).join('<br>')}</p>`:''}`;
}

/* ── 폴더 직접 고르기 (인터넷 없이) ── */
async function ingest(files){
  show('<p class="none">파일을 살펴보는 중…</p>');
  let list;
  try{ await loadXLSX(); list=await collect(files); }
  catch(e){ show(`<div class="okbox bad"><b>열지 못했습니다</b>${esc(e.message)}</div>`); return; }
  if(!list.length){
    show(`<div class="okbox bad"><b>엑셀이 없습니다</b>
      드라이브에서 내려받은 zip 파일이나, 압축을 푼 폴더를 넣어 주세요.</div>`); return;
  }
  LOG=[];
  const man=(await idbGet('manifest'))||{};
  for(let n=0;n<list.length;n++){
    const f=list[n];
    if(n%4===0){
      show(`<div class="prog"><span style="width:${(n/list.length*100).toFixed(1)}%"></span></div>
        <p class="none">${n} / ${list.length} · ${esc(f.name.slice(0,40))}</p>`);
      await new Promise(r=>setTimeout(r,0));
    }
    try{
      const id='local:'+f.path;
      const e=parseEntry(id,f.path,f.name,await f.buf());
      if(e){ await idbSet('f:'+id,e); man[id]='1'; }
    }catch(err){ LOG.push(`${f.name} · ${err.message}`); }
  }
  await idbSet('manifest',man);
  const ctx=rebuildAll(await cachedEntries());
  show(report(ctx,{n:list.length,got:list.length,del:0}));
}

/* ── 저장 ── */
const CLR=['#list','#newbody','#report','#sres','#sheetbody','#cards','#lh','#lgbody'];
function saveAll(){
  const keep=CLR.map(s=>{const e=$(s);return e?e.innerHTML:null;});
  CLR.forEach(s=>{const e=$(s);if(e)e.innerHTML='';});
  const sheetOn=$('#sheet').className;
  $('#sheet').className='sheet';
  let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  html=html.replace(/\/\*DB_START\*\/[\s\S]*?\/\*DB_END\*\//,
    '/*DB_START*/const DB='+JSON.stringify(DB)+';/*DB_END*/');
  CLR.forEach((s,i)=>{const e=$(s);if(e&&keep[i]!=null)e.innerHTML=keep[i];});
  $('#sheet').className=sheetOn;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download='TRACE.html'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

const EV_FN='https://tgahofsamuyqsihfamas.supabase.co/functions/v1/events';
const EV_API=`${SB_URL}/rest/v1/events`;
const EVK={popup:['◆','팝업'],fair:['▲','북페어·행사'],promo:['●','출판사 프로모션'],
  store:['▣','서점 기획전'],goods:['◈','굿즈']};
let EVDATA=null, EVPER='all', EVKIND2='all', EVAUTO=0;

const ymd=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
const sbHead={apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json'};

async function evLoad(force){
  if(EVDATA&&!force)return EVDATA;
  let r;
  try{
    r=await fetch(`${EV_API}?select=*&order=date_from.desc&limit=500`,{headers:sbHead});
  }catch(e){
    // 망에 못 닿은 경우다. 화면에는 무엇을 하면 되는지 적는다.
    throw new Error('서버에 닿지 못했습니다. 인터넷 연결을 확인해 주세요.');
  }
  if(!r.ok){
    const t=await r.text().catch(()=>'');
    throw new Error(`목록을 받지 못했습니다 · ${r.status} ${t.slice(0,90)}`);
  }
  const d=await r.json();
  // 오류 응답은 배열이 아니다. 그대로 두면 아래 filter 에서 화면이 깨진다.
  EVDATA=Array.isArray(d)?d:[];
  if(!Array.isArray(d)&&d&&d.message)throw new Error(String(d.message).slice(0,90));
  return EVDATA;
}
/** 이 프로젝트 자료에서 출판사 이름을 뽑는다. 걸러내는 힌트로 쓴다. */
function pubHints(){
  const c={};
  Object.values(DB.hist||{}).forEach(b=>{ if(b.p)c[b.p]=(c[b.p]||0)+1; });
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,40)
    .map(x=>x[0].replace(/\(.*?\)/g,'').trim()).filter(x=>x.length>=2);
}
/** 여러 채널에서 갈래별로 모아 담는다. 네이버 키가 있어야 한다. */
async function evNews(kinds,onStep){
  const c=getCfg();
  const id=(c.nvid||'').trim(), sec=(c.nvsec||'').trim();
  if(!id||!sec)throw new Error('네이버 Client ID 와 Secret 을 먼저 등록해 주세요.');
  if(onStep)onStep('찾는 중…');
  const r=await fetch(EV_FN,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({op:'news',id,secret:sec,kinds,hints:pubHints()})});
  const j=await r.json();
  if(j.error)throw new Error(j.error);
  const got=j.items||[];
  if(!got.length)return 0;
  const pubs=pubHints();
  const rows=got.map(x=>({
    id:x.key, kind:x.kind, title:x.t, brief:x.d||null,
    date_from:x.from||null, date_to:x.to||null, place:x.place||null,
    tags:x.kw||[],
    publisher:(pubs.find(h=>`${x.t} ${x.d}`.includes(h))||null),
    src_url:x.url||null, extra_url:null, img_url:null,
    // 기간을 못 뽑았으면 올라온 날을 쓴 것이라 추정으로 둔다
    status:x.guess?'추정':'확인',
  }));
  const w=await fetch(EV_API,{method:'POST',
    headers:{...sbHead,Prefer:'resolution=merge-duplicates'},body:JSON.stringify(rows)});
  if(!w.ok)throw new Error(`저장하지 못했습니다 · ${w.status}`);
  EVDATA=null;
  return rows.length;
}

/** 팝플리 범위를 훑어 새 행사를 담는다. */
async function evScan(from,to,onStep){
  const hints=pubHints();
  const got=[];
  for(let a=from;a<=to;a+=40){
    const b=Math.min(a+39,to);
    if(onStep)onStep(a,b);
    const r=await fetch(EV_FN,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({op:'scan',from:a,to:b,hints})});
    const j=await r.json();
    if(j.error)throw new Error(j.error);
    (j.items||[]).forEach(x=>got.push(x));
  }
  if(!got.length)return 0;
  // 서버에 담는다. 같은 번호는 덮어쓴다.
  const rows=got.map(x=>({
    id:'popply:'+x.id, kind:'popup', title:x.t, brief:x.d||null,
    date_from:x.from||null, date_to:x.to||null, place:x.place||null,
    tags:x.kw||[], publisher:(hints.find(h=>`${x.t} ${(x.kw||[]).join(' ')}`.includes(h))||null),
    src_url:x.url, extra_url:x.insta||null, img_url:x.img||null, status:'확인',
  }));
  const w=await fetch(EV_API,{method:'POST',
    headers:{...sbHead,Prefer:'resolution=merge-duplicates'},body:JSON.stringify(rows)});
  if(!w.ok)throw new Error(`저장하지 못했습니다 · ${w.status}`);
  EVDATA=null;
  return rows.length;
}
/** 이 행사 기간에 그 출판사 책들이 어떻게 움직였나. */
function evImpact(ev){
  if(!ev.publisher||!ev.date_from)return null;
  const from=ev.date_from, to=ev.date_to||ev.date_from;
  const hit=[];
  Object.entries(DB.hist||{}).forEach(([i,b])=>{
    if(!(b.p||'').includes(ev.publisher))return;
    const h=(b.h||[]).filter(x=>x.r!=null).map(x=>({d:String(x.d).replace(/-/g,''),r:x.r}));
    if(h.length<2)return;
    const before=h.filter(x=>x.d<from), during=h.filter(x=>x.d>=from&&x.d<=to);
    if(!before.length||!during.length)return;
    const b0=before.at(-1).r, d0=Math.min(...during.map(x=>x.r));
    hit.push({i,t:b.t,gap:b0-d0});
  });
  if(!hit.length)return null;
  const up=hit.filter(x=>x.gap>0);
  return {n:hit.length, up:up.length,
    avg:hit.reduce((a,x)=>a+x.gap,0)/hit.length,
    list:hit.sort((a,b)=>b.gap-a.gap).slice(0,4)};
}
function evPeriod(ev,today){
  const f=ev.date_from||'', t=ev.date_to||f;
  if(!f)return 'all';
  if(f<=today&&today<=t)return 'now';
  if(f>today)return 'soon';
  return 'past';
}
/** 기간 탭·가져오기·도서 이동을 잇는다. 화면을 다시 그릴 때마다 부른다. */
function bindEv(){
  const seg=$('#evseg');
  if(seg&&!seg.dataset.on){
    seg.dataset.on='1';
    seg.onclick=e=>{
      const b=e.target.closest('button'); if(!b)return;
      EVPER=b.dataset.p;
      seg.querySelectorAll('button').forEach(x=>
        x.setAttribute('aria-selected', x===b?'true':'false'));
      paintEvents().then(bindEv);
    };
  }
  const kd=$('#evkind');
  if(kd&&!kd.dataset.on){
    kd.dataset.on='1';
    kd.onclick=e=>{
      const b=e.target.closest('button'); if(!b)return;
      EVKIND2=b.dataset.k;
      kd.querySelectorAll('button').forEach(x=>
        x.setAttribute('aria-selected', x===b?'true':'false'));
      paintEvents().then(bindEv);
    };
  }
  document.querySelectorAll('.evbk').forEach(b=>
    b.onclick=()=>openBook(b.dataset.i));
  const add=$('#evadd');
  if(add&&!add.dataset.on){ add.dataset.on='1'; add.onclick=evManual; }
}

  box.innerHTML='<p class="src" style="padding:16px">받는 중…</p>';
  let all;
  try{ all=await evLoad(); }
  catch(e){
    box.innerHTML=`<div class="empty"><b>받지 못했습니다</b>${esc(e.message||e)}</div>`+evTools();
    return;
  }

  const today=ymd(new Date());
  const rows=all.filter(x=>
    (EVPER==='all'||evPeriod(x,today)===EVPER)&&
    (EVKIND2==='all'||x.kind===EVKIND2));
  if(!rows.length){
    box.innerHTML=`<div class="empty"><b>${
      EVPER==='now'?'진행 중인 행사가 없습니다':EVPER==='soon'?'예정된 행사가 없습니다'
      :EVPER==='past'?'지난 행사가 없습니다':'담긴 행사가 없습니다'}</b>

  const keys=Object.keys(g).sort((a,b)=>EVPER==='soon'?a.localeCompare(b):b.localeCompare(a));

  box.innerHTML=`<p class="evcnt">${rows.length}건${
    EVAUTO?` · <i class="evauto">새로 ${EVAUTO}건</i>`:''}</p>`
    +keys.map(k=>`<div class="evmon">
      <h3>${k==='____'?'날짜 미상':`${k.slice(0,4)}년 ${+k.slice(4,6)}월`}</h3>
      ${g[k].map(x=>evCard(x,today)).join('')}
    </div>`).join('')+evTools();
}
function evCard(x,today){
  const [ic,lb]=EVKIND(x.kind);
  const per=evPeriod(x,today);
  const d=x.date_from?`${x.date_from.slice(4,6)}.${x.date_from.slice(6,8)}`
    +(x.date_to&&x.date_to!==x.date_from?` ~ ${x.date_to.slice(4,6)}.${x.date_to.slice(6,8)}`:''):'';
  const left=per==='now'&&x.date_to
    ? Math.round((Date.parse(`${x.date_to.slice(0,4)}-${x.date_to.slice(4,6)}-${x.date_to.slice(6,8)}`)
      -Date.now())/864e5) : null;
  const im=evImpact(x);
  return `<article class="evc ${per}">
    ${x.img_url?`<div class="evimg"><img src="${esc(x.img_url)}" alt="" loading="lazy"
      referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></div>`:''}
    <div class="evb">
      <div class="evk"><span>${ic}</span>${esc(lb)}
        ${x.status==='추정'?'<i class="gs">추정</i>':''}
        ${per==='now'?`<i class="live">진행 중${left!=null&&left>=0?` · ${left}일 남음`:''}</i>`:''}
        ${per==='soon'?'<i class="soon">예정</i>':''}</div>
      <h4>${esc(x.title||'')}</h4>
      <p class="evm">${d?`<b>${d}</b>`:''}${x.place?` · ${esc(x.place)}`:''}</p>
      ${x.brief?`<p class="evd">${esc(x.brief)}…</p>`:''}
      ${(x.tags||[]).length?`<div class="evtags">${x.tags.slice(0,6)
        .map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
      ${im?`<div class="evimp">
        <b>${x.publisher} 도서 ${im.n}종 중 ${im.up}종 상승</b>
        ${im.list.map(y=>`<button class="evbk" data-i="${esc(y.i)}">
          ${esc(y.t.slice(0,22))}<i class="${y.gap>0?'up':y.gap<0?'dn':''}">${
          y.gap>0?`▲${y.gap}`:y.gap<0?`▼${-y.gap}`:'–'}</i></button>`).join('')}
      </div>`:''}
      <div class="evl">
        ${x.src_url?`<a href="${esc(x.src_url)}" target="_blank" rel="noopener">자세히 →</a>`:''}
        ${x.extra_url?`<a href="${esc(x.extra_url)}" target="_blank" rel="noopener">원본 →</a>`:''}
      </div>
    </div>
  </article>`;
}

/* ── 관리자 ────────────────────────────────────────────────
   보는 화면(순위·리포트)과 관리하는 화면을 나눈다.
   주소 끝에 #admin 을 붙이거나 로고를 길게 눌러 연다. */
let ADTAB='stat';

/* 관리자 잠금.
   단일 HTML 이라 소스를 열면 우회할 수 있다 — 암호화가 아니라
   「다른 사람이 우연히 들어가는 것」을 막는 장치다.
   비밀번호를 그대로 두지 않고 해시만 담아 눈으로는 안 보이게 했다. */
const ADPW='f2c5c4dd69c4e47743cbe30a6f74a54d73b295bf26df0e18a0d1c9d8a93f51fb';
async function sha(t){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
const adUnlocked=()=>{ try{ return sessionStorage.getItem('trace.admin')==='1'; }catch(e){ return false; } };
/** 잠금 화면. 통과하면 그 세션 동안 다시 묻지 않는다. */
function adAsk(){
  const w=$('#adlock'); if(!w)return;
  w.hidden=false;
  const inp=$('#adpw'), msg=$('#adpwmsg');
  inp.value=''; msg.textContent=''; setTimeout(()=>inp.focus(),60);
  const done=()=>{ w.hidden=true; };
  const tryPw=async()=>{
    const v=inp.value.trim();
    if(!v)return;
    if(await sha('trace.admin.'+v)===ADPW){
      try{ sessionStorage.setItem('trace.admin','1'); }catch(e){}
      done(); adOpen();
    }else{
      msg.textContent='비밀번호가 다릅니다.';
      inp.value=''; inp.focus();
    }
  };

/** 화면에 쓸 수치를 한 번에 모은다. 모두 적재된 자료에서 직접 센다. */
function adStats(){
  const P=DB.paths||{}, H=DB.hist||{};
  const rec={};
  let total=0;
  [['daily','일간'],['weekly','주간'],['monthly','월간'],['annual','연간']].forEach(([k,ko])=>{
    const rows=(DB[k]||[]).reduce((a,r)=>a+r.rows.length,0);
    rec[ko]={n:(DB[k]||[]).length, rows};
    total+=rows;
  });
  const st={확인:0,추정:0,미확인:0};
  let auto=0, facts=0, srcs=0, chars=0;
  Object.values(P).forEach(v=>{
    st[v.s]=(st[v.s]||0)+1;
    if(/규칙으로 분류한 것/.test(v.n||''))auto++;
    facts+=(v.f||[]).length; srcs+=(v.u||[]).length;
    chars+=((v.n||'')+(v.n1||'')+(v.k||'')+(v.f||[]).join('')).length;
  });
  const tags={};
  Object.values(P).forEach(v=>{ if(v.s==='확인'||v.s==='추정')
    (v.tags||[]).forEach(t=>{ if(t!=='none')tags[t]=(tags[t]||0)+1; }); });
  const d=(DB.daily||[]).filter(r=>!r.src);
  return {rec,total,books:Object.keys(H).length,paths:Object.keys(P).length,
    st,auto,facts,srcs,chars,tags,
    span:d.length?[`${d[0].y}.${d[0].m}.${d[0].d}`,`${d.at(-1).y}.${d.at(-1).m}.${d.at(-1).d}`]:null,
    press:Object.values(DB.press||{}).reduce((a,v)=>a+v.items.length,0)};
}

/* 키 생김새로 어느 API 인지 알아낸다.
   서비스마다 접두어나 길이가 달라서 대부분 한 번에 갈린다.
   갈리지 않는 것(64자리 16진수)만 되물어 본다. */
function sniffKey(v){
  const t=(v||'').trim();
  if(!t)return null;
  if(/^ttb[a-z0-9]+$/i.test(t))            return ['alakey'];
  if(/^yk_(live|test)_/i.test(t))           return ['y24key'];
  if(/^AIza[\w-]{30,}$/.test(t))            return ['ytkey'];
  if(/^https:\/\/script\.google\.com\//.test(t)) return ['gsUrl'];
  if(/^EAA[\w]{40,}$/.test(t))              return ['metaTok'];
  if(/^act_?\d{6,}$/i.test(t)||/^\d{8,20}$/.test(t)) return ['metaAct'];
  if(/^[0-9a-f]{32}$/i.test(t))             return ['kakaokey'];
  // 64자리 16진수는 국립중앙도서관과 정보나루가 같은 형식이다
  if(/^[0-9a-f]{64}$/i.test(t))             return ['libkey','nlkey'];
  // 네이버는 길이로 가른다 — ID 는 10~20자, Secret 은 10자 안팎의 다른 문자셋
  if(/^[A-Za-z0-9_]{8,24}$/.test(t)&&/[A-Z]/.test(t)&&/[a-z0-9]/.test(t)) return ['nvid'];
  if(/^[A-Za-z0-9]{25,60}$/.test(t))        return ['nvsec'];
  return [];
}

function adApiBind(){
  const val=$('#apival'), add=$('#apiadd'), hint=$('#apihint');
  if(!val)return;
  let pick=null;                       // 지금 고른 키 이름
  const show=()=>{
    const v=val.value.trim();
    pick=null;
    if(!v){ hint.hidden=true; add.disabled=true; return; }
    const g=sniffKey(v);
    hint.hidden=false;
    if(!g||!g.length){
      hint.innerHTML=`<p class="warn">어느 API 키인지 알아내지 못했습니다.
        앞뒤가 잘리지 않았는지 확인해 주세요.</p>`;
      add.disabled=true; return;
    }
    if(g.length>1){
      // 갈리지 않을 때만 되묻는다
      hint.innerHTML=`<p>둘 중 어느 것인가요?</p>
        <div class="pickrow">${g.map(k=>
          `<button class="pickb" data-pick="${k}">${esc(KEYNAME[k])}</button>`).join('')}</div>`;
      hint.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
        pick=b.dataset.pick;
        hint.querySelectorAll('.pickb').forEach(x=>x.classList.toggle('on',x===b));
        add.disabled=false;
      });
      add.disabled=true; return;
    }
    pick=g[0];
    const a=APIS.find(x=>x.k===pick);
    const has=(getCfg()[pick]||'').trim();
    hint.innerHTML=`<p><b style="color:var(--gr)">${esc(KEYNAME[pick])}</b> 키로 보입니다.</p>
      ${a&&a.where?`<p class="wh">${esc(a.where)}</p>`:''}
      ${a&&a.pair&&!(getCfg()[a.pair]||'').trim()
        ? `<p class="warn">${esc(KEYNAME[a.pair])}도 함께 넣어야 작동합니다.</p>`:''}
      ${has?`<p class="warn">이미 등록돼 있습니다. 새로 넣으면 바뀝니다.</p>`:''}`;
    add.disabled=false;
  };
  val.oninput=show;
  add.onclick=()=>{
    const v=val.value.trim();
    if(!v||!pick)return;
    setCfg(Object.assign(getCfg(),{[pick]:v}));
    add.textContent=`${KEYNAME[pick]} 등록`;
    setTimeout(()=>adRender(),800);
  };
  val.onkeydown=e=>{ if(e.key==='Enter'&&!add.disabled)add.click(); };
  const sp=$('#syncpw'), su=$('#syncup'), sd=$('#syncdn'), sm=$('#syncmsg');
  if(su){
    const say=(t,bad)=>{ sm.textContent=t; sm.style.color=bad?'var(--up)':'var(--gr)'; };
    const pw=()=>{
      const v=(sp.value||'').trim();
      if(!v){ say('비밀번호를 넣어 주세요.',1); sp.focus(); }
      return v;
    };
    su.onclick=async()=>{
      const v=pw(); if(!v)return;
      su.disabled=true; say('올리는 중…');
      try{ const n=await cfgPush(v); say(`${n}개를 올렸습니다.`); }
      catch(e){ say(e.message||String(e),1); }
      su.disabled=false;
    };
    sd.onclick=async()=>{
      const v=pw(); if(!v)return;
      sd.disabled=true; say('받는 중…');
      try{
        const r=await cfgPull(v);
        say(`${r.n}개를 받았습니다.`);
        setTimeout(()=>adRender(),900);
      }catch(e){ say(e.message||String(e),1); }
      sd.disabled=false;
    };
    sp.onkeydown=e=>{ if(e.key==='Enter')su.click(); };
  }
  document.querySelectorAll('#adbody [data-del]').forEach(b=>{
    b.onclick=()=>{
      if(!confirm('이 키를 지울까요?'))return;
      setCfg(Object.assign(getCfg(),{[b.dataset.del]:''}));
      adRender();
    };
  });
}

      브라우저 저장소를 비우면 캐시와 키가 함께 지워집니다.</p>

<!-- ═══ 모바일 보정 · 2026-09-30 ═══════════════════════════════════════
     이 블록 하나만 </body> 바로 앞에 붙이면 된다. 원래 코드는 건드리지 않고
     덮어쓰기·감싸기만 하므로, 판이 조금 달라도 그대로 옮겨 붙일 수 있다.
     고친 것
       1) 지표 칸(.gr3)이 상자 안에 상자가 또 들어가던 것 — 자식 div 에도 테두리가 붙었다
       2) 판매지수 그래프 숫자가 폰에서 6px 로 줄고 오른쪽 끝이 잘리던 것
          — 680px 기준으로 그린 뒤 화면 폭에 맞춰 축소하던 방식을, 실제 폭으로 그리게 바꿨다
       3) 「직전 대비」가 실제로는 첫 관측 대비였던 것 — 직전 관측 대비로 바꾸고 관측일을 붙였다
       4) 신규 진입 목록의 숫자에 이름표가 없던 것 — 알라딘 판매지수라고 밝힌다
       5) 분야 목록에서 판매지수가 없는 책에 정가가 같은 칸에 섞여 나오던 것
       6) 폰에서 제목이 몇 글자 만에 잘리던 목록, 한 줄에 못 들어가던 날짜 선택줄
       7) 분석 리포트 [그래프 2] 판매지수 증감률이 전부 「0%」로 나오던 것
          — 서버의 증감률(sr) 칸이 0 으로만 들어온다. 직전 회차 판매지수로 화면에서 직접 계산한다
       8) 분석 리포트 [그래프 1] 순위 추이 글자가 폰에서 5px 로 줄던 것
       9) 막대그래프 이름표가 「세네카,…」 「신간 · …」처럼 잘리던 것 — 폰에서는 이름을 윗줄에
      10) 작은 글자·누르기 어려운 버튼 몇 곳 (표지 연결하기, 임시 표시, 접기 제목), 빈 주차 선택칸
      11) 서버 연동 — ① 처음 여는 기기는 「파일에 심어 둔 자료」가 기본이라 서버 자료가 안 보였다 → 서버를 기본으로
          ② 서버에서 받은 뒤에도 도서 이력(DB.hist)을 다시 만들지 않아, 파일 날짜 이후에 새로 들어온 책은
             눌러도 상세가 열리지 않았고 순위·판매지수 그래프가 파일 날짜에서 멈춰 있었다 → 서버 회차로 다시 만든다
     ════════════════════════════════════════════════════════════════════ -->
<style id="mfix0930">

<script id="mfix0930js">
(function(){
  const cssW=()=>{
    const el=document.querySelector('#sheetbody')||document.body;
    const w=el.clientWidth||document.documentElement.clientWidth||375;
    return Math.round(Math.max(260,Math.min(680,w-12)));   // .chart 좌우 여백 6px 씩
  };
  const md=s=>{ const t=String(s||''); return t.length>=5?t.slice(5).replace('-','/'):t; };

  /* 2) 판매지수 그래프 — 화면 폭 그대로 그린다. 글자는 실제 11px */
  window.chart=chart=function(pts,inv){
    const W=cssW(),H=inv?150:168;
    const vs=pts.map(p=>p.v);
    if(vs.length<2)return `<p class="none">자료가 2회차 미만이라 추이를 그리지 않습니다.</p>`;
    const mn=Math.min(...vs),mx=Math.max(...vs),flat=mx===mn,rg=(mx-mn)||1;
    const lbl=v=>inv?v+'위':fmt(v);
    // 오른쪽 여백은 가장 긴 숫자 폭만큼 잡는다 (11px 기준 한 글자 6.6px)
    const R=Math.max(...[mx,mn].map(v=>String(lbl(v)).length))*6.6+12;
    const L=8,T=14,B=24;
    const X=n=>L+(W-L-R)*(n/(pts.length-1));
    const Y=v=>flat?T+(H-T-B)/2:inv?T+(H-T-B)*((v-mn)/rg):T+(H-T-B)*(1-(v-mn)/rg);
    const line=pts.map((p,n)=>`${n?'L':'M'}${X(n).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
    const area=`${line} L${X(pts.length-1).toFixed(1)},${H-B} L${X(0).toFixed(1)},${H-B} Z`;
    const rise=pts[pts.length-1].v>=pts[0].v, col=inv?(rise?'#3d87f5':'#f5455c'):(rise?'#f5455c':'#3d87f5');
    const gid='mfg'+Math.random().toString(36).slice(2,7);
    const dots=pts.map((p,n)=>`<circle cx="${X(n).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${n===pts.length-1?3.4:2.4}" fill="${col}"/>`).join('');
    // 눈금선 + 최고·최저 값
    const lv=flat?[mx]:[mx,mn];
    const grid=lv.map(v=>`<line x1="${L}" x2="${(W-R+4).toFixed(1)}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"
      stroke="#2a2a2a" stroke-dasharray="2 3"/>`).join('');
    const lab=lv.map(v=>`<text x="${W-2}" y="${(Y(v)+4).toFixed(1)}" font-size="11" fill="#8a8a8a"
      text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif"
      style="font-variant-numeric:tabular-nums">${lbl(v)}</text>`).join('');
    const xt=[0,pts.length-1].map(n=>`<text x="${X(n).toFixed(1)}" y="${H-6}" font-size="10.5" fill="#6a6a6a"
      text-anchor="${n?'end':'start'}">${esc(pts[n].l)}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg"
      style="width:100%;height:auto;display:block">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${col}" stop-opacity=".24"/>
        <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      ${grid}<path d="${area}" fill="url(#${gid})"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}${lab}${xt}</svg>`;
  };

  /* 순위 그래프도 같은 이유로 폰에서 글자가 6px 로 줄었다 */
  window.rankChart=rankChart=function(pts){
    const W=cssW(),H=W<480?176:210,L=18,R=18,T=30,B=28;
    if(pts.length<2)return `<p class="none">자료가 2회차 미만이라 추이를 그리지 않습니다.</p>`;
    const vs=pts.map(p=>p.v);
    const mn=Math.min(...vs),mx=Math.max(...vs),flat=mx===mn,rg=(mx-mn)||1;
    const X=n=>L+(W-L-R)*(n/(pts.length-1));
    const Y=v=>flat?T+(H-T-B)/2:T+(H-T-B)*((v-mn)/rg);
    const line=pts.map((p,n)=>`${n?'L':'M'}${X(n).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
    const area=`${line} L${X(pts.length-1).toFixed(1)},${H-B} L${X(0).toFixed(1)},${H-B} Z`;
    const rise=pts[pts.length-1].v<=pts[0].v, col=rise?'#f5455c':'#3d87f5';
    const gid='mfr'+Math.random().toString(36).slice(2,7);
    // 라벨끼리 최소 52px 떨어뜨린다. 처음·끝·최고 순위를 먼저 잡고 나머지를 사이에 채운다
    const GAP=52, best=vs.indexOf(mn), n1=pts.length-1;
    const pick=new Set([0,n1]);
    if(Math.abs(X(best)-X(0))>=GAP&&Math.abs(X(n1)-X(best))>=GAP)pick.add(best);
    for(let n=1;n<n1;n++){
      if([...pick].every(k=>Math.abs(X(k)-X(n))>=GAP))pick.add(n);
    }
    let g='';
    pts.forEach((p,n)=>{
      const x=X(n),y=Y(p.v);
      g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${col}" stroke="#141418" stroke-width="1.4"/>`;
      const last=n===n1;
      if(!pick.has(n))return;
      const anchor=n===0?'start':last?'end':'middle';
      const dx=n===0?-3:last?3:0;
      g+=`<text x="${(x+dx).toFixed(1)}" y="${(y-9).toFixed(1)}" font-size="11.5" font-weight="700"
          fill="#f0f0f3" text-anchor="${anchor}">${p.v}위</text>`;
      g+=`<text x="${(x+dx).toFixed(1)}" y="${H-8}" font-size="10.5" fill="#6a6a6a"
          text-anchor="${anchor}">${esc(p.l)}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg"
      style="width:100%;height:auto;display:block">
      <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${col}" stop-opacity=".22"/>
        <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#${gid})"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      ${g}</svg>`;
  };

  /* 3) 도서 상세의 판매지수 칸 — 직전 관측 대비 + 관측일 */
  function fixSheet(){
    try{
      const b=DB.hist[CUR]; if(!b)return;
      const h=(b.h||[]).filter(e=>e.s!=null);
      const box=[...document.querySelectorAll('#sheetbody h3.s')]
        .find(x=>/서점이 제공하는 지표/.test(x.textContent));
      const g=box&&box.nextElementSibling;
      if(!g||!g.classList.contains('gr3'))return;
      const all=b.h||[], rk=all.filter(e=>e.r!=null);
      const last=h[h.length-1], prev=h[h.length-2], first=h[0];
      const pct=(a,c)=>a&&c&&a.s?((c.s-a.s)/a.s*100):null;
      const p1=pct(prev,last);
      const sgn=v=>v==null?'–':(v>0?'+':'')+v.toFixed(1)+'%';
      const cls=v=>v==null?'':v>0?'up':v<0?'dn':'';
      g.innerHTML=`
        <div><div class="k">알라딘 판매지수</div>
          <div class="v num">${last?fmt(last.s):'–'}</div>
          <div class="s2">${last?'관측 '+md(last.d):'미등재'}</div></div>
        <div><div class="k">직전 관측 대비</div>
          <div class="v num ${cls(p1)}">${sgn(p1)}</div>
          <div class="s2">${prev?md(prev.d)+' → '+md(last.d):'비교 회차 없음'}</div></div>
        <div><div class="k">등장 회차</div>
          <div class="v num">${rk.length}<small>회</small></div>
          <div class="s2">통합 순위 기준</div></div>`;
      // 관측이 1회뿐인데 「알라딘 미등재」라고 나오던 안내를 바로잡는다
      if(h.length===1){ const nt=g.nextElementSibling;
        if(nt&&nt.classList.contains('none')&&/미등재/.test(nt.textContent))
          nt.textContent='판매지수 관측이 아직 1회뿐이라 추이를 그리지 않습니다.'; }
      // 그래프 밑에 첫 관측 → 최근 관측을 날짜와 함께 적는다 (원칙 12)
      let ch=g.nextElementSibling;
      if(ch&&ch.classList.contains('chart')&&first&&last&&first!==last&&!ch.querySelector('.mf-cap')){
        const pf=pct(first,last);
        ch.insertAdjacentHTML('beforeend',`<p class="mf-cap">${md(first.d)} <b class="mf-num">${fmt(first.s)}</b>
          → ${md(last.d)} <b class="mf-num">${fmt(last.s)}</b>
          <span class="${cls(pf)}">(${sgn(pf)})</span> · 관측 ${h.length}회</p>`);
      }
    }catch(e){ /* 보정 실패는 원래 화면을 그대로 둔다 */ }
  }
  if(typeof paintBook==='function'){
    const _pb=paintBook;
    window.paintBook=paintBook=function(){ const r=_pb.apply(this,arguments); fixSheet(); return r; };
  }

  /* 4) 신규 진입 목록 — 숫자가 무엇인지 머리줄로 밝힌다 */
  if(typeof paintNew==='function'){
    const _pn=paintNew;
    window.paintNew=paintNew=function(){
      const r=_pn.apply(this,arguments);
      try{
        const first=document.querySelector('#newbody .row');
        if(first&&!document.querySelector('#newbody .mf-nlh'))
          first.insertAdjacentHTML('beforebegin',
            '<div class="lh mf-nlh"><span>순위</span><span>도서</span><span>알라딘 판매지수</span><span></span></div>');
      }catch(e){}
      return r;
    };
  }

  /* 5) 분야 목록 — 판매지수가 없을 때 정가가 같은 칸에 들어가지 않게 */
  if(typeof paintGenre==='function'){
    const _pg=paintGenre;
    window.paintGenre=paintGenre=async function(){
      const r=await _pg.apply(this,arguments);
      try{
        const hasSp=GSHOP!=='kyobo';
        const lh=document.querySelector('#lh');
        if(lh&&lh.children[3])lh.children[3].textContent=hasSp?'판매지수':'정가';
        if(hasSp)document.querySelectorAll('#list .row.grow2 .s').forEach(s=>{
          if(/원$/.test(s.textContent.trim())){
            s.title='판매지수 없음 · 정가 '+s.textContent.trim();
            s.innerHTML='<span class="fl">–</span>';
          }
        });
      }catch(e){}
      return r;
    };
  }


  /* 7) 판매지수 증감률(sr) — 서버 값이 0/빈칸이면 직전 회차 판매지수로 계산한다.
     sr 의 정의(직전 회차 대비 판매지수 증감률)를 그대로 따른다. 직전 회차에 같은 책의
     판매지수가 없으면 계산하지 않는다 — 며칠 전 값과 비교하지 않기 위해서다(원칙 12). */
  const SRDONE=new WeakSet();
  function fillSR(){
    try{
      ['daily','weekly'].forEach(m=>{
        const set=SETS[m]||[];
        for(let i=set.length-1;i>0;i--){
          const cur=set[i]; if(!cur||SRDONE.has(cur))continue;
          const pv=prevOf(set,i); SRDONE.add(cur); if(!pv)continue;
          const ps={}; (pv.rows||[]).forEach(x=>{ if(x.s!=null&&x.s>0)ps[x.i]=x.s; });
          (cur.rows||[]).forEach(x=>{
            if((x.sr==null||x.sr===0)&&x.s!=null&&ps[x.i]!=null){
              const v=Math.round((x.s-ps[x.i])/ps[x.i]*1000)/10;
              x.sr=v; x._srCalc=true;
            }
          });
        }
      });
    }catch(e){}
  }
  fillSR();
  if(typeof paint==='function'){
    const _pa=paint;
    window.paint=paint=function(){ fillSR(); return _pa.apply(this,arguments); };
  }
  if(typeof paintReport==='function'){
    const _pr=paintReport;
    window.paintReport=paintReport=function(){
      fillSR();
      const r=_pr.apply(this,arguments);
      try{
        const h=[...document.querySelectorAll('#report h3.s')].find(x=>/\[그래프 2\]/.test(x.textContent));
        const cur=SETS[mode]&&SETS[mode][idx[mode]];
        if(h&&cur&&(cur.rows||[]).some(x=>x._srCalc)&&!h.nextElementSibling.classList.contains('mf-srnote')){
          const pv=prevOf(SETS[mode],idx[mode]);
          h.insertAdjacentHTML('afterend',`<p class="mf-srnote">${esc(pv?pv.label:'직전 회차')} → ${esc(cur.label)} 알라딘 판매지수로 계산한 값입니다.</p>`);
        }
      }catch(e){}
      return r;
    };
  }

  /* 8) 리포트 순위 추이 — 실제 폭으로 그린다 */
  if(typeof rankLines==='function'){
    window.rankLines=rankLines=function(sel){
      const dates=DB.daily.filter(d=>!d.src).map(d=>`${d.y}-${d.m}-${d.d}`);
      if(dates.length<2||!sel.length)return '';
      const box=document.querySelector('#report')||document.body;
      const W=Math.round(Math.max(280,Math.min(680,(box.clientWidth||360)-16)));
      const nar=W<480, H=nar?220:230, L=30, R=nar?92:118, T=16, B=24, MX=50;
      const TL=nar?6:9;                               // 이름표 글자 수
      const X=n=>L+(W-L-R)*(n/(dates.length-1));
      const Y=r=>T+(H-T-B)*((Math.min(r,MX)-1)/(MX-1));
      let g='';
      [1,10,20,30,40,50].forEach(r=>{
        g+=`<line x1="${L}" y1="${Y(r).toFixed(1)}" x2="${(W-R+4).toFixed(1)}" y2="${Y(r).toFixed(1)}" stroke="#26262e" stroke-width="1"/>
          <text x="${L-6}" y="${(Y(r)+3.5).toFixed(1)}" font-size="10.5" fill="#7a7a7a" text-anchor="end">${r===1?'1위':r}</text>`;
      });
      [0,dates.length-1].forEach(n=>{
        g+=`<text x="${X(n).toFixed(1)}" y="${H-6}" font-size="10.5" fill="#7a7a7a" text-anchor="${n?'end':'start'}">${dates[n].slice(5).replace('-','/')}</text>`;
      });
      const labs=[];
      sel.forEach((b,si)=>{
        const c=LINEC[si%4], by={};
        ((DB.hist[b.i]||{}).h||[]).forEach(e=>{ if(e.r!=null)by[e.d]=e.r; });
        const pts=dates.map((d,n)=>by[d]!=null?[n,by[d]]:null).filter(Boolean);
        if(!pts.length)return;
        if(pts.length>1)g+=`<path d="${pts.map((q,n)=>`${n?'L':'M'}${X(q[0]).toFixed(1)},${Y(q[1]).toFixed(1)}`).join(' ')}"
          fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
        pts.forEach(q=>{ g+=`<circle cx="${X(q[0]).toFixed(1)}" cy="${Y(q[1]).toFixed(1)}" r="2.8" fill="${c}" stroke="#141418" stroke-width="1.2"/>`; });
        const last=pts[pts.length-1];
        labs.push({x:X(last[0]),y:Y(last[1]),ty:Y(last[1]),c,t:b.t});
      });
      labs.sort((a,b)=>a.ty-b.ty);
      const GAPY=15;
      for(let i=1;i<labs.length;i++)if(labs[i].ty-labs[i-1].ty<GAPY)labs[i].ty=labs[i-1].ty+GAPY;
      const over=labs.length?labs[labs.length-1].ty-(H-B):0; if(over>0)labs.forEach(l=>l.ty-=over);
      const under=labs.length?(T+4)-labs[0].ty:0; if(under>0)labs.forEach(l=>l.ty+=under);
      labs.forEach(l=>{
        if(Math.abs(l.ty-l.y)>1.5)g+=`<path d="M${(l.x+4).toFixed(1)},${l.y.toFixed(1)} L${(l.x+11).toFixed(1)},${l.ty.toFixed(1)}" stroke="${l.c}" stroke-width="1" opacity=".5" fill="none"/>`;
        g+=`<circle cx="${(l.x+14).toFixed(1)}" cy="${l.ty.toFixed(1)}" r="3" fill="${l.c}"/>
          <text x="${(l.x+20).toFixed(1)}" y="${(l.ty+4).toFixed(1)}" font-size="11" fill="#f0f0f3">${esc(l.t.length>TL?l.t.slice(0,TL)+'…':l.t)}</text>`;
      });
      return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">${g}</svg>`;
    };
  }


  /* 11) 서버 연동 */
  // ① 「서버 쓰기」를 한 번도 고르지 않은 기기는 서버를 기본으로 쓴다. 「파일 쓰기」를 직접 고른 기기는 그대로 둔다.
  try{
    const K=(typeof CFG_K!=='undefined')?CFG_K:'tower.cfg';
    const c=JSON.parse(localStorage.getItem(K)||'{}')||{};
    if(c.useServer===undefined){ c.useServer=true; localStorage.setItem(K,JSON.stringify(c)); }
  }catch(e){}
  // ② 서버 회차로 도서 이력을 다시 만든다 (파일에만 있는 연간·주간 기록은 살린다)
  function rebuildHist(){
    const H=JSON.parse(JSON.stringify(BASE.hist||{}));
    const meta=(b,x)=>{ [['t','t'],['au','au'],['p','p'],['g','g'],['pd','pd'],['pr','pr']].forEach(([k,f])=>{ if(!b[k]&&x[f])b[k]=x[f]; }); };
    (DB.daily||[]).filter(rd=>!rd.src).forEach(rd=>{
      const d=`${rd.y}-${rd.m}-${rd.d}`;
      (rd.rows||[]).forEach(x=>{
        if(!x.i)return;
        const b=H[x.i]||(H[x.i]={t:x.t,h:[]}); meta(b,x); b.h=b.h||[];
        const e={d,r:x.r,s:x.s!=null?x.s:null,k:x.k!=null?x.k:null,y:x.y!=null?x.y:null,a:x.a!=null?x.a:null};
        const j=b.h.findIndex(q=>q.d===d); if(j>=0)b.h[j]=e; else b.h.push(e);
      });
    });
    // 주간 기록은 서버 주간 회차로 새로 쓴다
    const wk={};
    (DB.weekly||[]).forEach(rd=>(rd.rows||[]).forEach(x=>{ if(!x.i)return;
      (wk[x.i]||(wk[x.i]=[])).push({l:rd.label+(rd.src?` (${rd.src})`:''),r:x.r,s:x.s!=null?x.s:null});
      if(!H[x.i]){ H[x.i]={t:x.t,h:[]}; } meta(H[x.i],x); }));
    Object.entries(wk).forEach(([i,a])=>{ H[i].wk=a; });
    Object.values(H).forEach(b=>{ if(b.h)b.h.sort((p,q)=>p.d<q.d?-1:p.d>q.d?1:0); });
    DB.hist=H;
  }
  if(typeof serverSync==='function'){
    const _ss=serverSync;
    window.serverSync=serverSync=async function(){
      const n=await _ss.apply(this,arguments);
      window.__mfSrv=true;
      if(n>0){
        try{
          rebuildHist();
          try{ if(typeof rebuildHalf==='function'){ rebuildHalf(); SETS.half=DB.half; } }catch(e){}
          rebuildSearch(); fillSR(); paint();
          const sh=document.querySelector('#sheet');
          if(sh&&sh.classList.contains('on')&&CUR&&DB.hist[CUR])paintBook();
        }catch(e){ console.warn('[mfix] 이력 재구성 실패',e); }
      }
      return n;
    };
  }
  // 시작 루틴이 이 블록보다 먼저 서버 확인을 지나쳤을 때를 대비해 한 번 더 확인한다
  addEventListener('load',()=>setTimeout(()=>{
    try{ if(!window.__mfSrv&&getCfg().useServer)serverSync(true); }catch(e){}
  },2500));

  // 화면을 돌리면 그래프 폭이 달라진다 — 열려 있는 상세만 다시 그린다
  let rt=null, lw=innerWidth;
  addEventListener('resize',()=>{
    if(Math.abs(innerWidth-lw)<40)return;
    clearTimeout(rt); rt=setTimeout(()=>{ lw=innerWidth;
      const sh=document.querySelector('#sheet');
      if(sh&&sh.classList.contains('on')&&CUR){ const y=sh.scrollTop; paintBook(); sh.scrollTop=y; }
    },250);
  });
})();
</script>

<!-- ═══ 서버 자료 우선 · 2026-10-01 ═══════════════════════════════════════
     모바일 보정 블록 뒤, </body> 바로 앞에 붙인다. 원래 코드는 건드리지 않고 감싸기만 한다.
     고친 것

          → 되돌린 직후 서버 자료를 다시 얹는다 (서버는 1분 안에 다시 부르지 않고 받아 둔 것을 쓴다)
